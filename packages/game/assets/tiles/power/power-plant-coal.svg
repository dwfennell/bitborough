<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Building shadow -->
  <rect x="16" y="18" width="96" height="88" rx="2" fill="#000000" opacity="0.1" transform="translate(3, 3)"/>

  <!-- Lot ground (industrial yard) -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#c0c0b0"/>

  <!-- Fuel/loading area (dark rectangle) -->
  <rect x="12" y="96" width="28" height="18" rx="1" fill="#585858" opacity="0.4"/>
  <rect x="14" y="98" width="11" height="6" rx="0.5" fill="#c8b480" opacity="0.3"/>
  <rect x="27" y="98" width="11" height="6" rx="0.5" fill="#c8b480" opacity="0.25"/>
  <rect x="14" y="106" width="24" height="6" rx="0.5" fill="#585858" opacity="0.2"/>

  <!-- Factory walls -->
  <rect x="16" y="18" width="96" height="88" rx="2" fill="#d8d8d0"/>

  <!-- Roof (dark industrial) -->
  <rect x="13" y="15" width="102" height="82" rx="2" fill="#989880"/>

  <!-- Yellow warning/accent stripe -->
  <rect x="13" y="88" width="102" height="4" rx="0.5" fill="#e8d080" opacity="0.7"/>
  <rect x="13" y="89" width="102" height="2" rx="0.5" fill="#d8c070" opacity="0.5"/>

  <!-- Pipe runs on roof -->
  <g stroke="#8a8878" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="16" y1="35" x2="112" y2="35"/>
    <line x1="16" y1="50" x2="112" y2="50"/>
    <line x1="30" y1="62" x2="95" y2="62"/>
    <line x1="60" y1="25" x2="60" y2="70"/>
  </g>

  <!-- Pipe junction details -->
  <circle cx="60" cy="35" r="2.5" fill="#8a8878" opacity="0.4"/>
  <circle cx="60" cy="50" r="2.5" fill="#8a8878" opacity="0.4"/>

  <!-- Cooling tower 1 (seen from above) -->
  <circle cx="30" cy="42" r="11" fill="#a8a898" opacity="0.8"/>
  <circle cx="30" cy="42" r="8" fill="#989880" opacity="0.6"/>
  <circle cx="30" cy="42" r="4" fill="#8a8878" opacity="0.4"/>
  <circle cx="30" cy="42" r="2" fill="#707070" opacity="0.3"/>

  <!-- Cooling tower 2 (seen from above) -->
  <circle cx="90" cy="42" r="11" fill="#a8a898" opacity="0.8"/>
  <circle cx="90" cy="42" r="8" fill="#989880" opacity="0.6"/>
  <circle cx="90" cy="42" r="4" fill="#8a8878" opacity="0.4"/>
  <circle cx="90" cy="42" r="2" fill="#707070" opacity="0.3"/>

  <!-- Rust accent stripes on roof -->
  <rect x="13" y="72" width="102" height="3" rx="0.5" fill="#b09070" opacity="0.25"/>
  <rect x="13" y="20" width="102" height="2" rx="0.5" fill="#b09070" opacity="0.2"/>

  <!-- Smokestack 1 (tall, prominent) -->
  <rect x="42" y="2" width="8" height="22" rx="1.5" fill="#a8a898"/>
  <rect x="41" y="1" width="10" height="4" rx="1" fill="#989880"/>
  <!-- Smoke wisp 1 -->
  <path d="M46 0 Q49 -6 45 -12 Q42 -18 46 -24" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M47 -2 Q50 -8 47 -13 Q44 -17 48 -20" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Smokestack 2 (tall, prominent) -->
  <rect x="72" y="5" width="8" height="19" rx="1.5" fill="#a8a898"/>
  <rect x="71" y="4" width="10" height="4" rx="1" fill="#989880"/>
  <!-- Smoke wisp 2 -->
  <path d="M76 3 Q79 -3 75 -8 Q72 -13 76 -18" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  <path d="M77 1 Q80 -5 77 -10 Q74 -14 78 -17" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>

  <!-- Yellow accent band on smokestacks -->
  <rect x="42" y="18" width="8" height="3" rx="0.5" fill="#e8d080" opacity="0.6"/>
  <rect x="72" y="19" width="8" height="3" rx="0.5" fill="#e8d080" opacity="0.6"/>

  <!-- Loading bay doors on south wall -->
  <rect x="48" y="100" width="14" height="10" rx="0.5" fill="#585858" opacity="0.5"/>
  <line x1="55" y1="100" x2="55" y2="110" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  <rect x="66" y="100" width="14" height="10" rx="0.5" fill="#585858" opacity="0.5"/>
  <line x1="73" y1="100" x2="73" y2="110" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  <rect x="84" y="100" width="14" height="10" rx="0.5" fill="#585858" opacity="0.45"/>
  <line x1="91" y1="100" x2="91" y2="110" stroke="#989880" stroke-width="0.5" opacity="0.4"/>

  <!-- Small window on south wall -->
  <rect x="104" y="101" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="104" y="101" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
  <line x1="106.5" y1="101" x2="106.5" y2="106" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  <line x1="104" y1="103.5" x2="109" y2="103.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>

  <!-- Ground stain detail -->
  <ellipse cx="24" cy="116" rx="8" ry="3" fill="#b09070" opacity="0.15"/>
</svg>
