<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plGrassBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
  </defs>

  <!-- Base grass fill -->
  <rect width="128" height="128" fill="url(#plGrassBase)"/>

  <!-- Grass texture patches -->
  <ellipse cx="20" cy="20" rx="16" ry="10" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="100" cy="45" rx="18" ry="9" fill="#82c466" opacity="0.35"/>
  <ellipse cx="30" cy="90" rx="14" ry="10" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="105" cy="100" rx="12" ry="8" fill="#9ad680" opacity="0.35"/>
  <ellipse cx="15" cy="60" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="110" cy="15" rx="13" ry="8" fill="#82c466" opacity="0.3"/>

  <!-- Darker patches -->
  <ellipse cx="25" cy="50" rx="8" ry="5" fill="#6aaa50" opacity="0.25"/>
  <ellipse cx="100" cy="80" rx="10" ry="6" fill="#6aaa50" opacity="0.2"/>

  <!-- Power line cables (N-S, two parallel vertical lines) -->
  <g stroke="#585858" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="128"/>
    <line x1="68" y1="0" x2="68" y2="128"/>
  </g>

  <!-- Power tower at center -->
  <rect x="61" y="61" width="6" height="6" rx="0.5" fill="#8a8878"/>
  <!-- Cross-arm detail (horizontal bar through tower) -->
  <line x1="56" y1="64" x2="72" y2="64" stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Tower base shadow -->
  <rect x="61" y="61" width="6" height="6" rx="0.5" fill="#000000" opacity="0.05" transform="translate(1, 1)"/>

  <!-- Insulator dots on cross-arm -->
  <circle cx="57" cy="64" r="1" fill="#8a8878" opacity="0.6"/>
  <circle cx="71" cy="64" r="1" fill="#8a8878" opacity="0.6"/>
</svg>
