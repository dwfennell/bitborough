<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plGrassBase4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
  </defs>

  <!-- Base grass fill -->
  <rect width="128" height="128" fill="url(#plGrassBase4)"/>

  <!-- Grass texture patches -->
  <ellipse cx="22" cy="22" rx="14" ry="10" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="106" cy="22" rx="12" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="22" cy="106" rx="13" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="106" cy="106" rx="14" ry="8" fill="#9ad680" opacity="0.3"/>
  <ellipse cx="20" cy="64" rx="10" ry="6" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="108" cy="64" rx="10" ry="6" fill="#82c466" opacity="0.25"/>

  <!-- Darker patches -->
  <ellipse cx="30" cy="100" rx="8" ry="5" fill="#6aaa50" opacity="0.25"/>
  <ellipse cx="100" cy="30" rx="9" ry="5" fill="#6aaa50" opacity="0.2"/>

  <!-- Power line cables (N-S, two parallel vertical lines) -->
  <g stroke="#585858" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="128"/>
    <line x1="68" y1="0" x2="68" y2="128"/>
  </g>

  <!-- Power line cables (E-W, two parallel horizontal lines) -->
  <g stroke="#585858" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="0" y1="60" x2="128" y2="60"/>
    <line x1="0" y1="68" x2="128" y2="68"/>
  </g>

  <!-- Larger tower structure at center (4-way junction) -->
  <rect x="59" y="59" width="10" height="10" rx="1" fill="#000000" opacity="0.05" transform="translate(1, 1)"/>
  <rect x="59" y="59" width="10" height="10" rx="1" fill="#8a8878"/>
  <!-- Cross-arm details (both axes) -->
  <line x1="54" y1="64" x2="74" y2="64" stroke="#8a8878" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="64" y1="54" x2="64" y2="74" stroke="#8a8878" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Insulator dots -->
  <circle cx="55" cy="64" r="1.2" fill="#8a8878" opacity="0.6"/>
  <circle cx="73" cy="64" r="1.2" fill="#8a8878" opacity="0.6"/>
  <circle cx="64" cy="55" r="1.2" fill="#8a8878" opacity="0.6"/>
  <circle cx="64" cy="73" r="1.2" fill="#8a8878" opacity="0.6"/>

  <!-- Center tower detail (lattice hint) -->
  <line x1="60" y1="60" x2="68" y2="68" stroke="#707070" stroke-width="0.5" opacity="0.4"/>
  <line x1="68" y1="60" x2="60" y2="68" stroke="#707070" stroke-width="0.5" opacity="0.4"/>
</svg>
