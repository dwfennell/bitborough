<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plGrassBaseEW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
  </defs>

  <!-- Base grass fill -->
  <rect width="128" height="128" fill="url(#plGrassBaseEW)"/>

  <!-- Grass texture patches -->
  <ellipse cx="25" cy="25" rx="18" ry="11" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="90" cy="15" rx="15" ry="9" fill="#82c466" opacity="0.35"/>
  <ellipse cx="50" cy="100" rx="16" ry="10" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="90" rx="14" ry="8" fill="#9ad680" opacity="0.3"/>
  <ellipse cx="20" cy="105" rx="12" ry="7" fill="#a0da88" opacity="0.35"/>
  <ellipse cx="75" cy="35" rx="10" ry="6" fill="#82c466" opacity="0.3"/>

  <!-- Darker patches -->
  <ellipse cx="45" cy="20" rx="9" ry="5" fill="#6aaa50" opacity="0.25"/>
  <ellipse cx="85" cy="105" rx="10" ry="6" fill="#6aaa50" opacity="0.2"/>

  <!-- Power line cables (E-W, two parallel horizontal lines) -->
  <g stroke="#585858" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="0" y1="60" x2="128" y2="60"/>
    <line x1="0" y1="68" x2="128" y2="68"/>
  </g>

  <!-- Power tower at center -->
  <rect x="61" y="61" width="6" height="6" rx="0.5" fill="#8a8878"/>
  <!-- Cross-arm detail (vertical bar through tower) -->
  <line x1="64" y1="56" x2="64" y2="72" stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Tower base shadow -->
  <rect x="61" y="61" width="6" height="6" rx="0.5" fill="#000000" opacity="0.05" transform="translate(1, 1)"/>

  <!-- Insulator dots on cross-arm -->
  <circle cx="64" cy="57" r="1" fill="#8a8878" opacity="0.6"/>
  <circle cx="64" cy="71" r="1" fill="#8a8878" opacity="0.6"/>
</svg>
