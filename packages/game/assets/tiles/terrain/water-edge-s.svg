<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeSBase" x1="0" y1="0.5" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#78b8d8"/>
      <stop offset="100%" stop-color="#88c8e8"/>
    </linearGradient>
    <linearGradient id="grassEdgeSBase" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <clipPath id="waterClipS">
      <path d="M0 64 Q16 58 32 62 Q48 68 64 64 Q80 58 96 62 Q112 68 128 64 L128 128 L0 128 Z"/>
    </clipPath>
    <clipPath id="grassClipS">
      <path d="M0 0 L128 0 L128 64 Q112 68 96 62 Q80 58 64 64 Q48 68 32 62 Q16 58 0 64 Z"/>
    </clipPath>
  </defs>

  <!-- Grass half (top) -->
  <g clip-path="url(#grassClipS)">
    <!-- Base grass fill -->
    <rect width="128" height="128" fill="url(#grassEdgeSBase)"/>

    <!-- Grass texture patches -->
    <ellipse cx="25" cy="25" rx="16" ry="10" fill="#95d07a" opacity="0.45"/>
    <ellipse cx="85" cy="35" rx="18" ry="8" fill="#82c466" opacity="0.4"/>
    <ellipse cx="55" cy="48" rx="12" ry="7" fill="#9ad680" opacity="0.35"/>

    <!-- Dark grass patch -->
    <ellipse cx="15" cy="45" rx="10" ry="6" fill="#6aaa50" opacity="0.25"/>

    <!-- Grass blade cluster -->
    <g fill="#6aaa50" opacity="0.45">
      <path d="M95 22 L97 14 L99 22Z"/>
      <path d="M97 23 L100 13 L102 23Z"/>
      <path d="M93 23 L95 16 L98 23Z"/>
    </g>
  </g>

  <!-- Water half (bottom) -->
  <g clip-path="url(#waterClipS)">
    <!-- Base water fill -->
    <rect width="128" height="128" fill="url(#waterEdgeSBase)"/>

    <!-- Depth patch -->
    <ellipse cx="70" cy="100" rx="22" ry="12" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M10 85 Q25 82 40 85 Q55 88 70 85"/>
      <path d="M50 108 Q65 105 80 108 Q95 111 110 108"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M75 95 Q85 93 95 95"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="35" cy="90" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="100" cy="110" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Shoreline sand strip -->
  <path d="M0 64 Q16 58 32 62 Q48 68 64 64 Q80 58 96 62 Q112 68 128 64"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="14" cy="62" r="1.1" fill="#d8c498" opacity="0.35"/>
  <circle cx="38" cy="66" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="68" cy="63" r="1.2" fill="#d8c498" opacity="0.3"/>
  <circle cx="92" cy="61" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="118" cy="66" r="1.1" fill="#d8c498" opacity="0.3"/>
</svg>
