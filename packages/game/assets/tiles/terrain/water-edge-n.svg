<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeNBase" x1="0" y1="0" x2="0.3" y2="0.5">
      <stop offset="0%" stop-color="#88c8e8"/>
      <stop offset="100%" stop-color="#78b8d8"/>
    </linearGradient>
    <linearGradient id="grassEdgeNBase" x1="0" y1="0.5" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <clipPath id="waterClipN">
      <path d="M0 0 L128 0 L128 64 Q112 58 96 62 Q80 68 64 64 Q48 58 32 62 Q16 68 0 64 Z"/>
    </clipPath>
    <clipPath id="grassClipN">
      <path d="M0 64 Q16 68 32 62 Q48 58 64 64 Q80 68 96 62 Q112 58 128 64 L128 128 L0 128 Z"/>
    </clipPath>
  </defs>

  <!-- Water half (top) -->
  <g clip-path="url(#waterClipN)">
    <!-- Base water fill -->
    <rect width="128" height="128" fill="url(#waterEdgeNBase)"/>

    <!-- Depth patch -->
    <ellipse cx="50" cy="25" rx="24" ry="14" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M15 20 Q30 17 45 20 Q60 23 75 20"/>
      <path d="M55 40 Q70 37 85 40 Q100 43 115 40"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M25 32 Q35 30 45 32"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="40" cy="18" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="95" cy="30" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Grass half (bottom) -->
  <g clip-path="url(#grassClipN)">
    <!-- Base grass fill -->
    <rect width="128" height="128" fill="url(#grassEdgeNBase)"/>

    <!-- Grass texture patches -->
    <ellipse cx="30" cy="90" rx="16" ry="10" fill="#95d07a" opacity="0.45"/>
    <ellipse cx="90" cy="105" rx="18" ry="8" fill="#82c466" opacity="0.4"/>
    <ellipse cx="65" cy="80" rx="12" ry="7" fill="#9ad680" opacity="0.35"/>

    <!-- Dark grass patch -->
    <ellipse cx="105" cy="85" rx="10" ry="6" fill="#6aaa50" opacity="0.25"/>

    <!-- Grass blade cluster -->
    <g fill="#6aaa50" opacity="0.45">
      <path d="M75 110 L77 102 L79 110Z"/>
      <path d="M77 111 L80 101 L82 111Z"/>
      <path d="M73 111 L75 104 L78 111Z"/>
    </g>
  </g>

  <!-- Shoreline sand strip -->
  <path d="M0 64 Q16 68 32 62 Q48 58 64 64 Q80 68 96 62 Q112 58 128 64"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="18" cy="65" r="1.2" fill="#d8c498" opacity="0.35"/>
  <circle cx="42" cy="61" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="70" cy="65" r="1.3" fill="#d8c498" opacity="0.3"/>
  <circle cx="98" cy="62" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="115" cy="60" r="1.1" fill="#d8c498" opacity="0.3"/>
</svg>
