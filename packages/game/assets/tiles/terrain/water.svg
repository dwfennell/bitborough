<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterBase" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#88c8e8"/>
      <stop offset="50%" stop-color="#78b8d8"/>
      <stop offset="100%" stop-color="#88c8e8"/>
    </linearGradient>
    <!-- Subtle caustic/light pattern -->
    <radialGradient id="caustic1" cx="0.3" cy="0.4" r="0.3">
      <stop offset="0%" stop-color="#a8ddf0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a8ddf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caustic2" cx="0.7" cy="0.7" r="0.25">
      <stop offset="0%" stop-color="#a8ddf0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a8ddf0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base water -->
  <rect width="128" height="128" fill="url(#waterBase)"/>

  <!-- Light caustics -->
  <rect width="128" height="128" fill="url(#caustic1)"/>
  <rect width="128" height="128" fill="url(#caustic2)"/>

  <!-- Depth variation patches -->
  <ellipse cx="30" cy="60" rx="25" ry="18" fill="#6aaccf" opacity="0.2"/>
  <ellipse cx="95" cy="30" rx="20" ry="15" fill="#6aaccf" opacity="0.15"/>
  <ellipse cx="70" cy="100" rx="22" ry="12" fill="#6aaccf" opacity="0.18"/>

  <!-- Wave ripple lines -->
  <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M10 20 Q25 17 40 20 Q55 23 70 20"/>
    <path d="M50 48 Q65 45 80 48 Q95 51 110 48"/>
    <path d="M5 75 Q20 72 35 75 Q50 78 65 75"/>
    <path d="M60 100 Q75 97 90 100 Q105 103 120 100"/>
  </g>

  <!-- Smaller secondary ripples -->
  <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
    <path d="M20 38 Q30 36 40 38"/>
    <path d="M80 68 Q90 66 100 68"/>
    <path d="M30 110 Q45 108 55 110"/>
    <path d="M85 12 Q95 10 105 12"/>
  </g>

  <!-- Sparkle highlights -->
  <circle cx="45" cy="32" r="1.2" fill="#d0eef8" opacity="0.6"/>
  <circle cx="88" cy="55" r="1" fill="#d0eef8" opacity="0.5"/>
  <circle cx="25" cy="85" r="1.3" fill="#d0eef8" opacity="0.55"/>
  <circle cx="105" cy="90" r="0.9" fill="#d0eef8" opacity="0.45"/>
  <circle cx="65" cy="15" r="1.1" fill="#d0eef8" opacity="0.5"/>
</svg>
