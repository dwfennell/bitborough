<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeEBase" x1="0.5" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#78b8d8"/>
      <stop offset="100%" stop-color="#88c8e8"/>
    </linearGradient>
    <linearGradient id="grassEdgeEBase" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <clipPath id="waterClipE">
      <path d="M64 0 Q68 16 62 32 Q58 48 64 64 Q68 80 62 96 Q58 112 64 128 L128 128 L128 0 Z"/>
    </clipPath>
    <clipPath id="grassClipE">
      <path d="M0 0 L64 0 Q68 16 62 32 Q58 48 64 64 Q68 80 62 96 Q58 112 64 128 L0 128 Z"/>
    </clipPath>
  </defs>

  <!-- Grass half (left) -->
  <g clip-path="url(#grassClipE)">
    <!-- Base grass fill -->
    <rect width="128" height="128" fill="url(#grassEdgeEBase)"/>

    <!-- Grass texture patches -->
    <ellipse cx="20" cy="30" rx="14" ry="9" fill="#95d07a" opacity="0.45"/>
    <ellipse cx="35" cy="80" rx="16" ry="8" fill="#82c466" opacity="0.4"/>
    <ellipse cx="15" cy="110" rx="12" ry="7" fill="#9ad680" opacity="0.35"/>

    <!-- Dark grass patch -->
    <ellipse cx="40" cy="55" rx="10" ry="6" fill="#6aaa50" opacity="0.25"/>

    <!-- Grass blade cluster -->
    <g fill="#6aaa50" opacity="0.45">
      <path d="M25 95 L27 87 L29 95Z"/>
      <path d="M27 96 L30 86 L32 96Z"/>
      <path d="M23 96 L25 89 L28 96Z"/>
    </g>
  </g>

  <!-- Water half (right) -->
  <g clip-path="url(#waterClipE)">
    <!-- Base water fill -->
    <rect width="128" height="128" fill="url(#waterEdgeEBase)"/>

    <!-- Depth patch -->
    <ellipse cx="100" cy="50" rx="18" ry="14" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M75 25 Q78 40 75 55"/>
      <path d="M100 60 Q103 75 100 90"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M88 15 Q91 25 88 35"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="90" cy="22" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="110" cy="80" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Shoreline sand strip -->
  <path d="M64 0 Q68 16 62 32 Q58 48 64 64 Q68 80 62 96 Q58 112 64 128"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="66" cy="12" r="1.2" fill="#d8c498" opacity="0.35"/>
  <circle cx="61" cy="38" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="66" cy="70" r="1.3" fill="#d8c498" opacity="0.3"/>
  <circle cx="60" cy="100" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="65" cy="120" r="1.1" fill="#d8c498" opacity="0.3"/>
</svg>
