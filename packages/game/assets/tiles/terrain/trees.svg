<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="treesGrassBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
  </defs>

  <!-- Base grass fill (same as grass.svg) -->
  <rect width="128" height="128" fill="url(#treesGrassBase)"/>

  <!-- Grass texture patches -->
  <ellipse cx="20" cy="15" rx="18" ry="12" fill="#95d07a" opacity="0.5"/>
  <ellipse cx="85" cy="40" rx="22" ry="10" fill="#82c466" opacity="0.4"/>
  <ellipse cx="45" cy="90" rx="20" ry="14" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="110" cy="100" rx="16" ry="11" fill="#82c466" opacity="0.35"/>
  <ellipse cx="60" cy="55" rx="14" ry="9" fill="#9ad680" opacity="0.3"/>

  <!-- Darker grass patches -->
  <ellipse cx="35" cy="35" rx="10" ry="7" fill="#6aaa50" opacity="0.3"/>
  <ellipse cx="90" cy="80" rx="12" ry="8" fill="#6aaa50" opacity="0.25"/>

  <!-- Tree 1 (top-left area) -->
  <g>
    <!-- Shadow -->
    <circle cx="30" cy="28" r="13" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="27" cy="30" r="12" fill="#60a850"/>
    <circle cx="32" cy="27" r="11" fill="#78b868"/>
    <circle cx="30" cy="25" r="9" fill="#90c880"/>
  </g>

  <!-- Tree 2 (center-right) -->
  <g>
    <!-- Shadow -->
    <circle cx="95" cy="35" r="14" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="92" cy="37" r="13" fill="#60a850"/>
    <circle cx="97" cy="34" r="12" fill="#78b868"/>
    <circle cx="95" cy="32" r="10" fill="#90c880"/>
  </g>

  <!-- Tree 3 (center-left) -->
  <g>
    <!-- Shadow -->
    <circle cx="50" cy="60" r="12" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="47" cy="62" r="11" fill="#60a850"/>
    <circle cx="52" cy="59" r="10" fill="#78b868"/>
    <circle cx="50" cy="57" r="8" fill="#90c880"/>
  </g>

  <!-- Tree 4 (bottom-right) -->
  <g>
    <!-- Shadow -->
    <circle cx="100" cy="90" r="13" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="97" cy="92" r="12" fill="#60a850"/>
    <circle cx="102" cy="89" r="11" fill="#78b868"/>
    <circle cx="100" cy="87" r="9" fill="#90c880"/>
  </g>

  <!-- Tree 5 (bottom-left) -->
  <g>
    <!-- Shadow -->
    <circle cx="28" cy="95" r="12" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="25" cy="97" r="11" fill="#60a850"/>
    <circle cx="30" cy="94" r="10" fill="#78b868"/>
    <circle cx="28" cy="92" r="8" fill="#90c880"/>
  </g>

  <!-- Tree 6 (upper-center) -->
  <g>
    <!-- Shadow -->
    <circle cx="68" cy="18" r="11" fill="#000000" opacity="0.08" transform="translate(2,2)"/>
    <!-- Canopy layers -->
    <circle cx="65" cy="20" r="10" fill="#60a850"/>
    <circle cx="70" cy="17" r="9" fill="#78b868"/>
    <circle cx="68" cy="15" r="8" fill="#90c880"/>
  </g>
</svg>
