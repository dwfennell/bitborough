<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeSWBase" x1="0" y1="0.5" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#88c8e8"/>
      <stop offset="100%" stop-color="#78b8d8"/>
    </linearGradient>
    <linearGradient id="grassEdgeSWBase" x1="0.5" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <!-- Water fills bottom-left corner. Shoreline arcs from right edge y=64 to top edge x=64 -->
    <clipPath id="waterClipSW">
      <path d="M128 64 Q96 76 64 88 Q48 108 64 128 L0 128 L0 0 L64 0 Q48 20 64 40 Q96 52 128 64 Z"/>
    </clipPath>
  </defs>

  <!-- Grass background (full tile) -->
  <rect width="128" height="128" fill="url(#grassEdgeSWBase)"/>

  <!-- Grass texture patches (top-right area) -->
  <ellipse cx="100" cy="22" rx="14" ry="9" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="82" cy="48" rx="12" ry="7" fill="#82c466" opacity="0.4"/>
  <ellipse cx="112" cy="50" rx="10" ry="6" fill="#9ad680" opacity="0.35"/>

  <!-- Dark grass patch -->
  <ellipse cx="98" cy="14" rx="8" ry="5" fill="#6aaa50" opacity="0.25"/>

  <!-- Grass blade cluster -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M105 38 L107 30 L109 38Z"/>
    <path d="M107 39 L110 29 L112 39Z"/>
    <path d="M103 39 L105 32 L108 39Z"/>
  </g>

  <!-- Water corner (bottom-left), clipped to arc region -->
  <g clip-path="url(#waterClipSW)">
    <rect width="128" height="128" fill="url(#waterEdgeSWBase)"/>

    <!-- Depth patch -->
    <ellipse cx="28" cy="100" rx="18" ry="12" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M12 105 Q27 102 42 105"/>
      <path d="M38 15 Q35 28 38 40"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M22 82 Q19 92 22 102"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="18" cy="88" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="40" cy="118" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Shoreline sand strip (arc from right edge y=64 to top edge x=64) -->
  <path d="M64 0 Q48 20 64 40 Q96 52 128 64"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M128 64 Q96 76 64 88 Q48 108 64 128"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="62" cy="10" r="1.1" fill="#d8c498" opacity="0.35"/>
  <circle cx="55" cy="30" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="85" cy="54" r="1.2" fill="#d8c498" opacity="0.3"/>
  <circle cx="120" cy="65" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="95" cy="74" r="1.1" fill="#d8c498" opacity="0.3"/>
  <circle cx="68" cy="92" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="62" cy="120" r="1.2" fill="#d8c498" opacity="0.35"/>
</svg>
