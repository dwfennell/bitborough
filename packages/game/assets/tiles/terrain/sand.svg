<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sandBase" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8d8b0"/>
      <stop offset="100%" stop-color="#d8c498"/>
    </linearGradient>
  </defs>

  <!-- Base sand fill -->
  <rect width="128" height="128" fill="url(#sandBase)"/>

  <!-- Light texture patches -->
  <ellipse cx="25" cy="20" rx="20" ry="12" fill="#e8d8b0" opacity="0.4"/>
  <ellipse cx="95" cy="45" rx="18" ry="10" fill="#e8d8b0" opacity="0.35"/>
  <ellipse cx="55" cy="90" rx="22" ry="14" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="10" cy="65" rx="14" ry="9" fill="#e8d8b0" opacity="0.35"/>

  <!-- Darker sand patches for depth -->
  <ellipse cx="70" cy="30" rx="16" ry="8" fill="#c8b480" opacity="0.2"/>
  <ellipse cx="35" cy="70" rx="14" ry="10" fill="#c8b480" opacity="0.15"/>
  <ellipse cx="105" cy="100" rx="18" ry="9" fill="#c8b480" opacity="0.2"/>

  <!-- Wave-like sand ripple patterns -->
  <g fill="none" stroke="#c8b480" stroke-width="0.7" stroke-linecap="round" opacity="0.2">
    <path d="M8 25 Q25 22 42 25 Q60 28 78 25 Q95 22 112 25"/>
    <path d="M15 55 Q32 52 50 55 Q68 58 85 55 Q102 52 120 55"/>
    <path d="M5 85 Q22 82 40 85 Q58 88 75 85 Q92 82 110 85"/>
    <path d="M10 110 Q28 107 45 110 Q62 113 80 110 Q98 107 115 110"/>
  </g>

  <!-- Secondary finer ripples -->
  <g fill="none" stroke="#d8c498" stroke-width="0.5" stroke-linecap="round" opacity="0.25">
    <path d="M20 40 Q35 38 50 40 Q65 42 80 40"/>
    <path d="M45 70 Q60 68 75 70 Q90 72 105 70"/>
    <path d="M10 98 Q25 96 40 98 Q55 100 70 98"/>
  </g>

  <!-- Tiny shell details -->
  <g opacity="0.5">
    <ellipse cx="40" cy="35" rx="2" ry="1.2" fill="#e8d8b0" transform="rotate(25 40 35)"/>
    <ellipse cx="85" cy="62" rx="1.8" ry="1" fill="#e8c8d0" transform="rotate(-15 85 62)"/>
    <ellipse cx="22" cy="88" rx="1.5" ry="0.9" fill="#e8d8b0" transform="rotate(40 22 88)"/>
    <ellipse cx="100" cy="20" rx="1.6" ry="1" fill="#e8c8d0" transform="rotate(10 100 20)"/>
    <ellipse cx="60" cy="112" rx="1.8" ry="1.1" fill="#e8d8b0" transform="rotate(-30 60 112)"/>
  </g>
</svg>
