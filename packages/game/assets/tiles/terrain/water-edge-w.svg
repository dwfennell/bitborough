<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeWBase" x1="0" y1="0" x2="0.5" y2="0.3">
      <stop offset="0%" stop-color="#88c8e8"/>
      <stop offset="100%" stop-color="#78b8d8"/>
    </linearGradient>
    <linearGradient id="grassEdgeWBase" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <clipPath id="waterClipW">
      <path d="M0 0 L64 0 Q58 16 62 32 Q68 48 64 64 Q58 80 62 96 Q68 112 64 128 L0 128 Z"/>
    </clipPath>
    <clipPath id="grassClipW">
      <path d="M64 0 Q58 16 62 32 Q68 48 64 64 Q58 80 62 96 Q68 112 64 128 L128 128 L128 0 Z"/>
    </clipPath>
  </defs>

  <!-- Water half (left) -->
  <g clip-path="url(#waterClipW)">
    <!-- Base water fill -->
    <rect width="128" height="128" fill="url(#waterEdgeWBase)"/>

    <!-- Depth patch -->
    <ellipse cx="25" cy="45" rx="18" ry="14" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M15 30 Q18 45 15 60"/>
      <path d="M35 70 Q38 85 35 100"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M28 90 Q31 100 28 110"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="20" cy="20" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="40" cy="85" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Grass half (right) -->
  <g clip-path="url(#grassClipW)">
    <!-- Base grass fill -->
    <rect width="128" height="128" fill="url(#grassEdgeWBase)"/>

    <!-- Grass texture patches -->
    <ellipse cx="95" cy="25" rx="14" ry="9" fill="#95d07a" opacity="0.45"/>
    <ellipse cx="85" cy="75" rx="16" ry="8" fill="#82c466" opacity="0.4"/>
    <ellipse cx="110" cy="110" rx="12" ry="7" fill="#9ad680" opacity="0.35"/>

    <!-- Dark grass patch -->
    <ellipse cx="80" cy="50" rx="10" ry="6" fill="#6aaa50" opacity="0.25"/>

    <!-- Grass blade cluster -->
    <g fill="#6aaa50" opacity="0.45">
      <path d="M100 95 L102 87 L104 95Z"/>
      <path d="M102 96 L105 86 L107 96Z"/>
      <path d="M98 96 L100 89 L103 96Z"/>
    </g>
  </g>

  <!-- Shoreline sand strip -->
  <path d="M64 0 Q58 16 62 32 Q68 48 64 64 Q58 80 62 96 Q68 112 64 128"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="62" cy="10" r="1.2" fill="#d8c498" opacity="0.35"/>
  <circle cx="65" cy="40" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="62" cy="68" r="1.3" fill="#d8c498" opacity="0.3"/>
  <circle cx="66" cy="98" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="63" cy="122" r="1.1" fill="#d8c498" opacity="0.3"/>
</svg>
