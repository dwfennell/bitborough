<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="waterEdgeSEBase" x1="0.5" y1="0.5" x2="1" y2="1">
      <stop offset="0%" stop-color="#78b8d8"/>
      <stop offset="100%" stop-color="#88c8e8"/>
    </linearGradient>
    <linearGradient id="grassEdgeSEBase" x1="0" y1="0" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
    <!-- Water fills bottom-right corner. Shoreline arcs from left edge y=64 to top edge x=64 -->
    <clipPath id="waterClipSE">
      <path d="M0 64 Q32 76 64 88 Q80 108 64 128 L128 128 L128 0 L64 0 Q80 20 64 40 Q32 52 0 64 Z"/>
    </clipPath>
  </defs>

  <!-- Grass background (full tile) -->
  <rect width="128" height="128" fill="url(#grassEdgeSEBase)"/>

  <!-- Grass texture patches (top-left area) -->
  <ellipse cx="22" cy="25" rx="14" ry="9" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="40" cy="48" rx="12" ry="7" fill="#82c466" opacity="0.4"/>
  <ellipse cx="15" cy="50" rx="10" ry="6" fill="#9ad680" opacity="0.35"/>

  <!-- Dark grass patch -->
  <ellipse cx="30" cy="15" rx="8" ry="5" fill="#6aaa50" opacity="0.25"/>

  <!-- Grass blade cluster -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M18 38 L20 30 L22 38Z"/>
    <path d="M20 39 L23 29 L25 39Z"/>
    <path d="M16 39 L18 32 L21 39Z"/>
  </g>

  <!-- Water corner (bottom-right), clipped to arc region -->
  <g clip-path="url(#waterClipSE)">
    <rect width="128" height="128" fill="url(#waterEdgeSEBase)"/>

    <!-- Depth patch -->
    <ellipse cx="100" cy="100" rx="18" ry="12" fill="#6aaccf" opacity="0.18"/>

    <!-- Ripple lines -->
    <g fill="none" stroke="#a0d8f0" stroke-width="1" stroke-linecap="round" opacity="0.35">
      <path d="M82 105 Q97 102 112 105"/>
      <path d="M88 15 Q91 28 88 40"/>
    </g>

    <!-- Secondary ripple -->
    <g fill="none" stroke="#b0e0f4" stroke-width="0.7" stroke-linecap="round" opacity="0.3">
      <path d="M100 80 Q103 90 100 100"/>
    </g>

    <!-- Sparkle highlights -->
    <circle cx="108" cy="88" r="1.1" fill="#d0eef8" opacity="0.55"/>
    <circle cx="90" cy="118" r="0.9" fill="#d0eef8" opacity="0.5"/>
  </g>

  <!-- Shoreline sand strip (arc from left edge y=64 to top edge x=64) -->
  <path d="M64 0 Q80 20 64 40 Q32 52 0 64"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M0 64 Q32 76 64 88 Q80 108 64 128"
        fill="none" stroke="#d8c498" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Pebbles along shoreline -->
  <circle cx="66" cy="10" r="1.1" fill="#d8c498" opacity="0.35"/>
  <circle cx="72" cy="30" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="40" cy="55" r="1.2" fill="#d8c498" opacity="0.3"/>
  <circle cx="8" cy="65" r="0.9" fill="#c8b480" opacity="0.35"/>
  <circle cx="30" cy="74" r="1.1" fill="#d8c498" opacity="0.3"/>
  <circle cx="58" cy="92" r="1" fill="#c8b480" opacity="0.3"/>
  <circle cx="66" cy="120" r="1.2" fill="#d8c498" opacity="0.35"/>
</svg>
