<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dirtBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8c498"/>
      <stop offset="100%" stop-color="#d0bc90"/>
    </linearGradient>
  </defs>

  <!-- Base dirt fill -->
  <rect width="128" height="128" fill="url(#dirtBase)"/>

  <!-- Light texture patches -->
  <ellipse cx="22" cy="18" rx="20" ry="14" fill="#e8d8b0" opacity="0.35"/>
  <ellipse cx="90" cy="35" rx="18" ry="12" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="50" cy="80" rx="22" ry="10" fill="#e8d8b0" opacity="0.4"/>
  <ellipse cx="110" cy="95" rx="16" ry="11" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="15" cy="55" rx="14" ry="9" fill="#e8d8b0" opacity="0.3"/>

  <!-- Dark texture patches for depth -->
  <ellipse cx="65" cy="25" rx="16" ry="10" fill="#c8b480" opacity="0.3"/>
  <ellipse cx="30" cy="100" rx="20" ry="8" fill="#c8b480" opacity="0.25"/>
  <ellipse cx="95" cy="70" rx="18" ry="12" fill="#c8b480" opacity="0.35"/>
  <ellipse cx="40" cy="48" rx="12" ry="7" fill="#c8b480" opacity="0.2"/>
  <ellipse cx="115" cy="20" rx="10" ry="6" fill="#c8b480" opacity="0.3"/>

  <!-- Subtle cracks -->
  <g fill="none" stroke="#c8b480" stroke-width="0.5" stroke-linecap="round" opacity="0.2">
    <path d="M35 30 Q40 35 38 45 Q37 50 42 55"/>
    <path d="M80 60 Q85 65 82 72"/>
    <path d="M60 105 Q65 108 70 106 Q75 104 78 110"/>
  </g>

  <!-- Pebble details -->
  <g opacity="0.3">
    <circle cx="25" cy="40" r="1.5" fill="#c8b480"/>
    <circle cx="72" cy="15" r="1" fill="#c8b480"/>
    <circle cx="55" cy="65" r="1.8" fill="#c8b480"/>
    <circle cx="100" cy="50" r="1.2" fill="#c8b480"/>
    <circle cx="42" cy="115" r="1.5" fill="#c8b480"/>
    <circle cx="88" cy="100" r="1" fill="#c8b480"/>
    <circle cx="15" cy="85" r="1.3" fill="#c8b480"/>
    <circle cx="110" cy="115" r="1.8" fill="#e8d8b0"/>
    <circle cx="68" cy="45" r="1" fill="#e8d8b0"/>
    <circle cx="20" cy="120" r="1.2" fill="#c8b480"/>
  </g>
</svg>
