<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Under construction state overlay (scales to building footprint) -->

  <!-- === Dirt/excavation ground === -->
  <rect x="0" y="0" width="128" height="128" fill="#d8c498"/>
  <!-- Dirt texture patches -->
  <ellipse cx="32" cy="32" rx="18" ry="12" fill="#c8b480" opacity="0.4"/>
  <ellipse cx="90" cy="44" rx="22" ry="14" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="48" cy="88" rx="20" ry="10" fill="#c8b480" opacity="0.35"/>
  <ellipse cx="100" cy="96" rx="16" ry="10" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="14" cy="70" rx="10" ry="8" fill="#c8b480" opacity="0.3"/>

  <!-- === Construction safety fence (orange perimeter border) === -->
  <!-- Uses ind-rust (#b09070) as closest palette orange, plus power-yellow (#e8d080) for stripes -->
  <!-- North fence -->
  <rect x="4" y="4" width="120" height="8" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="4" width="10" height="4" rx="0.5"/>
    <rect x="24" y="4" width="10" height="4" rx="0.5"/>
    <rect x="44" y="4" width="10" height="4" rx="0.5"/>
    <rect x="64" y="4" width="10" height="4" rx="0.5"/>
    <rect x="84" y="4" width="10" height="4" rx="0.5"/>
    <rect x="104" y="4" width="10" height="4" rx="0.5"/>
  </g>
  <!-- South fence -->
  <rect x="4" y="116" width="120" height="8" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="116" width="10" height="4" rx="0.5"/>
    <rect x="24" y="116" width="10" height="4" rx="0.5"/>
    <rect x="44" y="116" width="10" height="4" rx="0.5"/>
    <rect x="64" y="116" width="10" height="4" rx="0.5"/>
    <rect x="84" y="116" width="10" height="4" rx="0.5"/>
    <rect x="104" y="116" width="10" height="4" rx="0.5"/>
  </g>
  <!-- West fence -->
  <rect x="4" y="12" width="8" height="104" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="14" width="4" height="10" rx="0.5"/>
    <rect x="4" y="34" width="4" height="10" rx="0.5"/>
    <rect x="4" y="54" width="4" height="10" rx="0.5"/>
    <rect x="4" y="74" width="4" height="10" rx="0.5"/>
    <rect x="4" y="94" width="4" height="10" rx="0.5"/>
  </g>
  <!-- East fence -->
  <rect x="116" y="12" width="8" height="104" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="120" y="14" width="4" height="10" rx="0.5"/>
    <rect x="120" y="34" width="4" height="10" rx="0.5"/>
    <rect x="120" y="54" width="4" height="10" rx="0.5"/>
    <rect x="120" y="74" width="4" height="10" rx="0.5"/>
    <rect x="120" y="94" width="4" height="10" rx="0.5"/>
  </g>

  <!-- === Crane (simple top-down silhouette) === -->
  <!-- Crane base/tower -->
  <rect x="72" y="48" width="8" height="8" rx="1" fill="#989880" opacity="0.8"/>
  <!-- Crane arm (horizontal jib pointing left) -->
  <rect x="26" y="49" width="46" height="4" rx="0.5" fill="#989880" opacity="0.75"/>
  <!-- Counter jib (short right side) -->
  <rect x="80" y="49" width="20" height="4" rx="0.5" fill="#989880" opacity="0.7"/>
  <!-- Hoist cable (diagonal line down from arm tip) -->
  <line x1="32" y1="53" x2="50" y2="78" stroke="#8a8878" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Hook load area -->
  <rect x="44" y="78" width="12" height="8" rx="1" fill="#c8b480" opacity="0.5"/>

  <!-- === Construction materials pile === -->
  <rect x="84" y="72" width="22" height="14" rx="1" fill="#c8b898" opacity="0.55"/>
  <rect x="87" y="70" width="14" height="4" rx="0.5" fill="#d8c498" opacity="0.5"/>

  <!-- === Rubble/foundation marks === -->
  <rect x="22" y="88" width="18" height="10" rx="1" fill="#c8b480" opacity="0.38"/>
  <line x1="22" y1="94" x2="40" y2="94" stroke="#b09070" stroke-width="0.5" opacity="0.4"/>
  <line x1="30" y1="88" x2="30" y2="98" stroke="#b09070" stroke-width="0.5" opacity="0.4"/>
</svg>
