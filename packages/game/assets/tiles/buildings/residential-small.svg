<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Transparent background - terrain renders underneath -->

  <!-- Building shadow (light source top-left) -->
  <rect x="44" y="38" width="40" height="32" rx="2" fill="#000000" opacity="0.1" transform="translate(3, 3)"/>

  <!-- Yard / lot ground -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#a0d48a" opacity="0.6"/>

  <!-- Garden path from house to south edge -->
  <rect x="60" y="72" width="8" height="48" rx="1" fill="#c8b898" opacity="0.45"/>

  <!-- House walls (visible below roof on south side) -->
  <rect x="44" y="38" width="40" height="36" rx="2" fill="#e8c8b0"/>
  <rect x="44" y="38" width="40" height="36" rx="2" fill="#e0b89a" opacity="0.3"/>

  <!-- Roof (top-down view - slightly larger than walls) -->
  <rect x="41" y="35" width="46" height="30" rx="2" fill="#d08870"/>
  <!-- Roof ridge line -->
  <line x1="64" y1="37" x2="64" y2="63" stroke="#c07060" stroke-width="1.5" opacity="0.5"/>
  <!-- Roof shingle texture -->
  <g stroke="#c07860" stroke-width="0.5" opacity="0.25">
    <line x1="43" y1="42" x2="85" y2="42"/>
    <line x1="43" y1="49" x2="85" y2="49"/>
    <line x1="43" y1="56" x2="85" y2="56"/>
  </g>

  <!-- Chimney (4x4px = 1m) -->
  <rect x="76" y="37" width="4" height="4" rx="0.5" fill="#a08070"/>
  <rect x="75" y="36" width="6" height="2" rx="0.5" fill="#8a7060"/>
  <!-- Chimney smoke wisp -->
  <path d="M78 35 Q79.5 30 77.5 25 Q76 20 78 16" fill="none" stroke="#d0d0d0" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- Windows (visible on south-facing wall below roof, 5x5px each) -->
  <rect x="48" y="67" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.8"/>
  <rect x="48" y="67" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
  <line x1="50.5" y1="67" x2="50.5" y2="72" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  <line x1="48" y1="69.5" x2="53" y2="69.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>

  <rect x="57" y="67" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.8"/>
  <rect x="57" y="67" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
  <line x1="59.5" y1="67" x2="59.5" y2="72" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  <line x1="57" y1="69.5" x2="62" y2="69.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>

  <!-- Door (4x8px) -->
  <rect x="70" y="66" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="73" cy="70.5" r="0.6" fill="#c0a080"/>

  <!-- Bushes around house (scaled down) -->
  <ellipse cx="40" cy="68" rx="3.5" ry="3" fill="#78b868" opacity="0.7"/>
  <ellipse cx="38.5" cy="66.5" rx="2.5" ry="2" fill="#90c880" opacity="0.6"/>
  <ellipse cx="88" cy="65" rx="3" ry="2.5" fill="#78b868" opacity="0.7"/>
  <ellipse cx="86.5" cy="63.5" rx="2" ry="2" fill="#88c070" opacity="0.6"/>

  <!-- Mailbox by the path (tiny) -->
  <rect x="68" y="82" width="1.5" height="3" rx="0.3" fill="#6088c0"/>
  <rect x="67.5" y="81" width="2.5" height="1.5" rx="0.5" fill="#5078b0"/>

  <!-- Yard details -->
  <!-- Small tree in yard -->
  <circle cx="22" cy="30" r="11" fill="#78b868" opacity="0.6"/>
  <circle cx="20" cy="28" r="8" fill="#90c880" opacity="0.5"/>
  <circle cx="24" cy="32" r="7" fill="#60a850" opacity="0.3"/>

  <!-- Flowers scattered in yard -->
  <circle cx="100" cy="90" r="1.5" fill="#e8c8d0" opacity="0.65"/>
  <circle cx="101.5" cy="88.5" r="1.2" fill="#d8a8b8" opacity="0.55"/>
  <circle cx="30" cy="100" r="1.5" fill="#e8d8a0" opacity="0.6"/>
  <circle cx="95" cy="30" r="1.5" fill="#e8c8d0" opacity="0.6"/>

  <!-- Grass blade cluster in yard -->
  <g fill="#6aaa50" opacity="0.4">
    <path d="M105 50 L106.5 44 L108 50Z"/>
    <path d="M107 50.5 L109 43 L110.5 50.5Z"/>
  </g>

  <!-- Parked car in driveway area (18x8px) -->
  <rect x="18" y="75" width="18" height="8" rx="2" fill="#90b8d8" opacity="0.5"/>
  <rect x="20" y="76" width="5" height="6" rx="1" fill="#a8d0e8" opacity="0.4"/>
  <rect x="30" y="76" width="4" height="6" rx="1" fill="#a8d0e8" opacity="0.4"/>
</svg>
