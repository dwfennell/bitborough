<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Derelict / abandoned building state overlay (scales to building footprint) -->

  <!-- === Lot ground (overgrown) === -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#a0d48a" opacity="0.28"/>
  <!-- Patchy weeds and overgrowth -->
  <ellipse cx="18" cy="20" rx="8" ry="6" fill="#82c466" opacity="0.3"/>
  <ellipse cx="108" cy="18" rx="10" ry="6" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="14" cy="100" rx="7" ry="5" fill="#6aaa50" opacity="0.35"/>
  <ellipse cx="112" cy="110" rx="8" ry="5" fill="#82c466" opacity="0.3"/>
  <ellipse cx="60" cy="112" rx="12" ry="4" fill="#8cc870" opacity="0.25"/>

  <!-- === Abandoned building shadow (muted) === -->
  <rect x="22" y="22" width="84" height="68" rx="2" fill="#000000" opacity="0.06" transform="translate(3,3)"/>

  <!-- === Deteriorated walls === -->
  <rect x="22" y="22" width="84" height="68" rx="2" fill="#d8c8b8"/>
  <rect x="22" y="22" width="84" height="68" rx="2" fill="#a8a898" opacity="0.22"/>

  <!-- === Crumbling roof (muted gray) === -->
  <rect x="20" y="20" width="88" height="60" rx="2" fill="#a8a898"/>
  <!-- Rust/crack streaks across roof -->
  <g stroke="#b09070" stroke-width="0.8" stroke-linecap="round" opacity="0.35">
    <line x1="24" y1="28" x2="38" y2="36"/>
    <line x1="70" y1="22" x2="80" y2="34"/>
    <line x1="90" y1="40" x2="104" y2="50"/>
    <line x1="44" y1="58" x2="56" y2="70"/>
  </g>
  <!-- Faded ridge line -->
  <line x1="22" y1="50" x2="108" y2="50" stroke="#989880" stroke-width="1.5" opacity="0.28"/>

  <!-- === Boarded-up windows on south wall (y=80–90) === -->
  <!-- 4 boarded windows (dark with X cross) -->
  <g>
    <rect x="26" y="74" width="8" height="8" rx="0.5" fill="#585858" opacity="0.55"/>
    <line x1="26" y1="74" x2="34" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
    <line x1="34" y1="74" x2="26" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g>
    <rect x="46" y="74" width="8" height="8" rx="0.5" fill="#585858" opacity="0.55"/>
    <line x1="46" y1="74" x2="54" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
    <line x1="54" y1="74" x2="46" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g>
    <rect x="74" y="74" width="8" height="8" rx="0.5" fill="#585858" opacity="0.55"/>
    <line x1="74" y1="74" x2="82" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
    <line x1="82" y1="74" x2="74" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g>
    <rect x="94" y="74" width="8" height="8" rx="0.5" fill="#585858" opacity="0.55"/>
    <line x1="94" y1="74" x2="102" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
    <line x1="102" y1="74" x2="94" y2="82" stroke="#989880" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- === Weed clusters growing through cracks === -->
  <!-- South of building -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M32 92 L33.5 85 L35 92Z"/>
    <path d="M34 92.5 L36 84 L37.5 92.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.4">
    <path d="M80 91 L81.5 84 L83 91Z"/>
    <path d="M82 91.5 L84 83 L85.5 91.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.35">
    <path d="M60 95 L61.5 88 L63 95Z"/>
  </g>

  <!-- === Scattered debris === -->
  <rect x="16" y="92" width="6" height="4" rx="0.5" fill="#c8b480" opacity="0.3"/>
  <rect x="108" y="88" width="4" height="6" rx="0.5" fill="#c8b480" opacity="0.28"/>
  <rect x="44" y="102" width="8" height="4" rx="0.5" fill="#d8c498" opacity="0.25"/>
</svg>
