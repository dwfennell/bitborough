<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- High-density commercial complex B (2x3 tile footprint — rendered taller than wide) -->

  <!-- === Building shadow === -->
  <rect x="10" y="10" width="108" height="86" rx="2" fill="#000000" opacity="0.1" transform="translate(3,3)"/>

  <!-- === Lot ground (paved commercial) === -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#d8d8d0" opacity="0.28"/>

  <!-- === Parking lot (narrow strip at south) === -->
  <rect x="10" y="100" width="108" height="20" rx="1" fill="#989890" opacity="0.18"/>
  <g stroke="#e0e0e0" stroke-width="0.7" opacity="0.3">
    <line x1="22" y1="100" x2="22" y2="120"/>
    <line x1="36" y1="100" x2="36" y2="120"/>
    <line x1="50" y1="100" x2="50" y2="120"/>
    <line x1="78" y1="100" x2="78" y2="120"/>
    <line x1="92" y1="100" x2="92" y2="120"/>
    <line x1="106" y1="100" x2="106" y2="120"/>
  </g>

  <!-- === Entrance plaza === -->
  <rect x="42" y="92" width="44" height="8" rx="2" fill="#c8c8c0" opacity="0.38"/>
  <!-- Plaza trees (ornamental) -->
  <circle cx="46" cy="96" r="4" fill="#78b868" opacity="0.5"/>
  <circle cx="82" cy="96" r="4" fill="#78b868" opacity="0.5"/>

  <!-- === Building walls === -->
  <rect x="10" y="10" width="108" height="86" rx="2" fill="#d8d8d0"/>

  <!-- === Roof (large office complex) === -->
  <rect x="8" y="8" width="112" height="78" rx="2" fill="#90b8d8"/>
  <rect x="8" y="8" width="112" height="6" rx="2" fill="#b0d0e8" opacity="0.3"/>

  <!-- Roof section grid (two wings) -->
  <line x1="64" y1="10" x2="64" y2="86" stroke="#a0c8e0" stroke-width="2" opacity="0.3"/>
  <line x1="10" y1="43" x2="118" y2="43" stroke="#a0c8e0" stroke-width="1.5" opacity="0.22"/>

  <!-- === HVAC units (6 for large complex) === -->
  <rect x="16" y="14" width="10" height="7" rx="1" fill="#a8a898" opacity="0.75"/>
  <circle cx="21" cy="17.5" r="2.5" fill="none" stroke="#8a8878" stroke-width="0.5" opacity="0.6"/>
  <circle cx="21" cy="17.5" r="0.8" fill="#8a8878" opacity="0.5"/>

  <rect x="34" y="14" width="10" height="7" rx="1" fill="#a8a898" opacity="0.7"/>
  <circle cx="39" cy="17.5" r="2.5" fill="none" stroke="#8a8878" stroke-width="0.5" opacity="0.6"/>
  <circle cx="39" cy="17.5" r="0.8" fill="#8a8878" opacity="0.5"/>

  <rect x="52" y="14" width="10" height="7" rx="1" fill="#a8a898" opacity="0.7"/>
  <circle cx="57" cy="17.5" r="2.5" fill="none" stroke="#8a8878" stroke-width="0.5" opacity="0.6"/>
  <circle cx="57" cy="17.5" r="0.8" fill="#8a8878" opacity="0.5"/>

  <rect x="80" y="14" width="10" height="7" rx="1" fill="#a8a898" opacity="0.7"/>
  <circle cx="85" cy="17.5" r="2.5" fill="none" stroke="#8a8878" stroke-width="0.5" opacity="0.6"/>
  <circle cx="85" cy="17.5" r="0.8" fill="#8a8878" opacity="0.5"/>

  <rect x="98" y="14" width="10" height="7" rx="1" fill="#a8a898" opacity="0.7"/>
  <circle cx="103" cy="17.5" r="2.5" fill="none" stroke="#8a8878" stroke-width="0.5" opacity="0.6"/>
  <circle cx="103" cy="17.5" r="0.8" fill="#8a8878" opacity="0.5"/>

  <!-- Large rooftop AC tower (center) -->
  <rect x="56" y="50" width="16" height="12" rx="1" fill="#a8a898" opacity="0.72"/>
  <rect x="58" y="52" width="12" height="4" rx="0.5" fill="#989880" opacity="0.5"/>
  <rect x="58" y="57" width="5" height="4" rx="0.5" fill="#8a8878" opacity="0.4"/>

  <!-- === Signage band === -->
  <rect x="20" y="82" width="88" height="4" rx="0.5" fill="#e8d080" opacity="0.4"/>

  <!-- === Windows on visible south wall (y=86–96) === -->
  <g fill="#a8d0e8" opacity="0.75">
    <rect x="11" y="87" width="7" height="6" rx="0.5"/>
    <rect x="21" y="87" width="7" height="6" rx="0.5"/>
    <rect x="31" y="87" width="7" height="6" rx="0.5"/>
    <rect x="41" y="87" width="7" height="6" rx="0.5"/>
    <!-- gap for doors -->
    <rect x="71" y="87" width="7" height="6" rx="0.5"/>
    <rect x="81" y="87" width="7" height="6" rx="0.5"/>
    <rect x="91" y="87" width="7" height="6" rx="0.5"/>
    <rect x="101" y="87" width="7" height="6" rx="0.5"/>
    <rect x="111" y="87" width="7" height="6" rx="0.5"/>
  </g>
  <g fill="none" stroke="#80a8c8" stroke-width="0.6" opacity="0.45">
    <rect x="11" y="87" width="7" height="6" rx="0.5"/>
    <rect x="21" y="87" width="7" height="6" rx="0.5"/>
    <rect x="31" y="87" width="7" height="6" rx="0.5"/>
    <rect x="41" y="87" width="7" height="6" rx="0.5"/>
    <rect x="71" y="87" width="7" height="6" rx="0.5"/>
    <rect x="81" y="87" width="7" height="6" rx="0.5"/>
    <rect x="91" y="87" width="7" height="6" rx="0.5"/>
    <rect x="101" y="87" width="7" height="6" rx="0.5"/>
    <rect x="111" y="87" width="7" height="6" rx="0.5"/>
  </g>

  <!-- === Main entrance (double doors) === -->
  <rect x="54" y="86" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="57" cy="90" r="0.6" fill="#c0a080"/>
  <rect x="60" y="86" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="63" cy="90" r="0.6" fill="#c0a080"/>

  <!-- Parked cars -->
  <rect x="23" y="104" width="8" height="12" rx="2" fill="#90b8d8" opacity="0.45"/>
  <rect x="79" y="104" width="8" height="12" rx="2" fill="#d08870" opacity="0.4"/>
  <rect x="93" y="104" width="8" height="12" rx="2" fill="#a8a898" opacity="0.38"/>
</svg>
