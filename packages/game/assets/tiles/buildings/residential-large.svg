<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- High-density residential apartment complex (2x2 tile footprint) -->

  <!-- === Building shadow === -->
  <rect x="10" y="12" width="108" height="76" rx="2" fill="#000000" opacity="0.1" transform="translate(3,3)"/>

  <!-- === Lot ground === -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#a0d48a" opacity="0.3"/>

  <!-- === Parking lot === -->
  <rect x="10" y="94" width="108" height="26" rx="1" fill="#989890" opacity="0.2"/>
  <g stroke="#e0e0e0" stroke-width="0.7" opacity="0.3">
    <line x1="22" y1="94" x2="22" y2="120"/>
    <line x1="36" y1="94" x2="36" y2="120"/>
    <line x1="50" y1="94" x2="50" y2="120"/>
    <line x1="78" y1="94" x2="78" y2="120"/>
    <line x1="92" y1="94" x2="92" y2="120"/>
    <line x1="106" y1="94" x2="106" y2="120"/>
  </g>

  <!-- === Front walkway === -->
  <rect x="26" y="88" width="76" height="6" rx="1" fill="#c8b898" opacity="0.42"/>
  <rect x="60" y="94" width="8" height="26" rx="1" fill="#c8b898" opacity="0.32"/>

  <!-- === Building walls === -->
  <rect x="10" y="12" width="108" height="76" rx="2" fill="#e8c8b0"/>
  <rect x="10" y="12" width="108" height="76" rx="2" fill="#e0b89a" opacity="0.18"/>

  <!-- === Roof === -->
  <rect x="8" y="10" width="112" height="68" rx="2" fill="#d08870"/>

  <!-- Horizontal ridge (two-storey hint) -->
  <line x1="10" y1="44" x2="118" y2="44" stroke="#c07060" stroke-width="2" opacity="0.45"/>
  <!-- Vertical wing divider -->
  <line x1="64" y1="10" x2="64" y2="78" stroke="#c07060" stroke-width="1.5" opacity="0.3"/>

  <!-- Roof shingle texture -->
  <g stroke="#c07860" stroke-width="0.5" opacity="0.18">
    <line x1="10" y1="22" x2="118" y2="22"/>
    <line x1="10" y1="32" x2="118" y2="32"/>
    <line x1="10" y1="38" x2="118" y2="38"/>
    <line x1="10" y1="54" x2="118" y2="54"/>
    <line x1="10" y1="62" x2="118" y2="62"/>
    <line x1="10" y1="70" x2="118" y2="70"/>
  </g>

  <!-- === Chimneys (3 for large building) === -->
  <rect x="20" y="11" width="4" height="4" rx="0.5" fill="#a08070"/>
  <rect x="19" y="10" width="6" height="2" rx="0.5" fill="#8a7060"/>
  <path d="M22 9 Q24 4 21 0 Q19 -4 22 -8" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>

  <rect x="60" y="11" width="4" height="4" rx="0.5" fill="#a08070"/>
  <rect x="59" y="10" width="6" height="2" rx="0.5" fill="#8a7060"/>
  <path d="M62 9 Q64 4 61 0 Q59 -4 62 -8" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.22"/>

  <rect x="100" y="11" width="4" height="4" rx="0.5" fill="#a08070"/>
  <rect x="99" y="10" width="6" height="2" rx="0.5" fill="#8a7060"/>

  <!-- === Windows on visible south wall (y=78–88) === -->
  <!-- 10 windows across two wings -->
  <g fill="#a8d0e8" opacity="0.8">
    <rect x="13" y="80" width="5" height="5" rx="0.5"/>
    <rect x="22" y="80" width="5" height="5" rx="0.5"/>
    <rect x="31" y="80" width="5" height="5" rx="0.5"/>
    <rect x="40" y="80" width="5" height="5" rx="0.5"/>
    <rect x="49" y="80" width="5" height="5" rx="0.5"/>
    <rect x="72" y="80" width="5" height="5" rx="0.5"/>
    <rect x="81" y="80" width="5" height="5" rx="0.5"/>
    <rect x="90" y="80" width="5" height="5" rx="0.5"/>
    <rect x="99" y="80" width="5" height="5" rx="0.5"/>
    <rect x="108" y="80" width="5" height="5" rx="0.5"/>
  </g>
  <g fill="none" stroke="#987868" stroke-width="0.5" opacity="0.55">
    <rect x="13" y="80" width="5" height="5" rx="0.5"/>
    <rect x="22" y="80" width="5" height="5" rx="0.5"/>
    <rect x="31" y="80" width="5" height="5" rx="0.5"/>
    <rect x="40" y="80" width="5" height="5" rx="0.5"/>
    <rect x="49" y="80" width="5" height="5" rx="0.5"/>
    <rect x="72" y="80" width="5" height="5" rx="0.5"/>
    <rect x="81" y="80" width="5" height="5" rx="0.5"/>
    <rect x="90" y="80" width="5" height="5" rx="0.5"/>
    <rect x="99" y="80" width="5" height="5" rx="0.5"/>
    <rect x="108" y="80" width="5" height="5" rx="0.5"/>
  </g>

  <!-- === Entrance doors (two) === -->
  <rect x="57" y="79" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="60" cy="83" r="0.6" fill="#c0a080"/>
  <rect x="66" y="79" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="69" cy="83" r="0.6" fill="#c0a080"/>

  <!-- === Yard details === -->
  <!-- Corner bushes flanking entrance -->
  <ellipse cx="13" cy="90" rx="3.5" ry="2.5" fill="#78b868" opacity="0.65"/>
  <ellipse cx="11.5" cy="88.5" rx="2.5" ry="2" fill="#90c880" opacity="0.55"/>
  <ellipse cx="115" cy="90" rx="3.5" ry="2.5" fill="#78b868" opacity="0.65"/>
  <ellipse cx="113.5" cy="88.5" rx="2.5" ry="2" fill="#90c880" opacity="0.55"/>

  <!-- Flowers near walkway -->
  <circle cx="26" cy="90" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="27.5" cy="88.5" r="1.2" fill="#d8a8b8" opacity="0.5"/>
  <circle cx="100" cy="90" r="1.5" fill="#e8d8a0" opacity="0.55"/>

  <!-- Parked cars -->
  <rect x="23" y="98" width="8" height="14" rx="2" fill="#d08870" opacity="0.42"/>
  <rect x="37" y="98" width="8" height="14" rx="2" fill="#90b8d8" opacity="0.38"/>
  <rect x="79" y="98" width="8" height="14" rx="2" fill="#a8a898" opacity="0.4"/>
  <rect x="93" y="98" width="8" height="14" rx="2" fill="#d08870" opacity="0.35"/>
</svg>
