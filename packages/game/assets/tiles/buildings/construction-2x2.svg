<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Under construction — 2×2 building footprint -->

  <!-- === Dirt/excavation ground === -->
  <rect x="0" y="0" width="128" height="128" fill="#d8c498"/>
  <!-- Dirt texture patches -->
  <ellipse cx="30" cy="28" rx="16" ry="11" fill="#c8b480" opacity="0.4"/>
  <ellipse cx="92" cy="38" rx="20" ry="13" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="44" cy="84" rx="18" ry="10" fill="#c8b480" opacity="0.35"/>
  <ellipse cx="98" cy="96" rx="18" ry="11" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="14" cy="68" rx="9" ry="7" fill="#c8b480" opacity="0.3"/>
  <ellipse cx="70" cy="62" rx="14" ry="9" fill="#e8d8b0" opacity="0.25"/>

  <!-- === Safety fence (orange perimeter border) === -->
  <!-- North fence -->
  <rect x="4" y="4" width="120" height="8" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="4" width="10" height="4" rx="0.5"/>
    <rect x="24" y="4" width="10" height="4" rx="0.5"/>
    <rect x="44" y="4" width="10" height="4" rx="0.5"/>
    <rect x="64" y="4" width="10" height="4" rx="0.5"/>
    <rect x="84" y="4" width="10" height="4" rx="0.5"/>
    <rect x="104" y="4" width="10" height="4" rx="0.5"/>
  </g>
  <!-- South fence -->
  <rect x="4" y="116" width="120" height="8" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="116" width="10" height="4" rx="0.5"/>
    <rect x="24" y="116" width="10" height="4" rx="0.5"/>
    <rect x="44" y="116" width="10" height="4" rx="0.5"/>
    <rect x="64" y="116" width="10" height="4" rx="0.5"/>
    <rect x="84" y="116" width="10" height="4" rx="0.5"/>
    <rect x="104" y="116" width="10" height="4" rx="0.5"/>
  </g>
  <!-- West fence -->
  <rect x="4" y="12" width="8" height="104" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="4" y="14" width="4" height="10" rx="0.5"/>
    <rect x="4" y="34" width="4" height="10" rx="0.5"/>
    <rect x="4" y="54" width="4" height="10" rx="0.5"/>
    <rect x="4" y="74" width="4" height="10" rx="0.5"/>
    <rect x="4" y="94" width="4" height="10" rx="0.5"/>
  </g>
  <!-- East fence -->
  <rect x="116" y="12" width="8" height="104" rx="1" fill="#b09070"/>
  <g fill="#e8d080" opacity="0.7">
    <rect x="120" y="14" width="4" height="10" rx="0.5"/>
    <rect x="120" y="34" width="4" height="10" rx="0.5"/>
    <rect x="120" y="54" width="4" height="10" rx="0.5"/>
    <rect x="120" y="74" width="4" height="10" rx="0.5"/>
    <rect x="120" y="94" width="4" height="10" rx="0.5"/>
  </g>

  <!-- === Tower crane (centered, larger arm span) === -->
  <!-- Crane tower base -->
  <rect x="58" y="42" width="10" height="10" rx="1.5" fill="#989880" opacity="0.85"/>
  <!-- Crane jib (long arm pointing left) -->
  <rect x="16" y="44" width="42" height="5" rx="0.5" fill="#989880" opacity="0.75"/>
  <!-- Counter jib (short arm pointing right) -->
  <rect x="68" y="44" width="26" height="5" rx="0.5" fill="#989880" opacity="0.7"/>
  <!-- Hoist cable -->
  <line x1="24" y1="49" x2="42" y2="78" stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Hook/load block -->
  <rect x="36" y="78" width="14" height="9" rx="1" fill="#c8b480" opacity="0.55"/>

  <!-- === Two material piles spread across site === -->
  <!-- Pile 1 (lower-left) -->
  <rect x="18" y="90" width="26" height="14" rx="1" fill="#c8b898" opacity="0.55"/>
  <rect x="21" y="88" width="18" height="5" rx="0.5" fill="#d8c498" opacity="0.5"/>
  <!-- Pile 2 (right side) -->
  <rect x="84" y="70" width="26" height="16" rx="1" fill="#c8b898" opacity="0.5"/>
  <rect x="87" y="68" width="18" height="5" rx="0.5" fill="#d8c498" opacity="0.45"/>

  <!-- === Foundation outline marks === -->
  <rect x="20" y="22" width="44" height="26" rx="1" fill="none" stroke="#b09070" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="22" x2="42" y2="48" stroke="#b09070" stroke-width="0.5" opacity="0.3"/>
  <line x1="20" y1="35" x2="64" y2="35" stroke="#b09070" stroke-width="0.5" opacity="0.3"/>
</svg>
