<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- High-density industrial complex B (4x3 tile footprint — rendered very wide) -->

  <!-- === Lot ground (large industrial campus) === -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#c0c0b0" opacity="0.28"/>

  <!-- === Building shadow === -->
  <rect x="8" y="10" width="112" height="72" rx="2" fill="#000000" opacity="0.1" transform="translate(3,3)"/>

  <!-- === Main campus walls === -->
  <rect x="8" y="10" width="112" height="72" rx="2" fill="#d8d8d0"/>

  <!-- === Main campus roof === -->
  <rect x="6" y="8" width="116" height="64" rx="2" fill="#989880"/>

  <!-- Roof bay divisions (4 factory bays across) -->
  <g stroke="#8a8878" stroke-width="1.2" opacity="0.38">
    <line x1="8" y1="8" x2="8" y2="72"/>
    <line x1="36" y1="8" x2="36" y2="72"/>
    <line x1="64" y1="8" x2="64" y2="72"/>
    <line x1="92" y1="8" x2="92" y2="72"/>
    <line x1="120" y1="8" x2="120" y2="72"/>
    <line x1="8" y1="36" x2="122" y2="36"/>
  </g>
  <!-- Roof highlights per bay -->
  <g fill="#c0c0b0" opacity="0.18">
    <rect x="8" y="8" width="26" height="26" rx="1"/>
    <rect x="38" y="8" width="24" height="26" rx="1"/>
    <rect x="66" y="8" width="24" height="26" rx="1"/>
    <rect x="94" y="8" width="24" height="26" rx="1"/>
  </g>

  <!-- === Smokestacks (6 stacks — wide campus) === -->
  <rect x="12" y="-4" width="6" height="16" rx="1" fill="#a8a898"/>
  <rect x="11" y="-5" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M15 -6 Q17 -11 14 -15" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>

  <rect x="26" y="-2" width="6" height="12" rx="1" fill="#a8a898"/>
  <rect x="25" y="-3" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M29 -4 Q31 -9 28 -12" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.22"/>

  <rect x="60" y="-4" width="6" height="16" rx="1" fill="#a8a898"/>
  <rect x="59" y="-5" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M63 -6 Q65 -11 62 -15" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.27"/>

  <rect x="74" y="-2" width="6" height="12" rx="1" fill="#a8a898"/>
  <rect x="73" y="-3" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M77 -4 Q79 -9 76 -12" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <rect x="96" y="-4" width="6" height="16" rx="1" fill="#a8a898"/>
  <rect x="95" y="-5" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M99 -6 Q101 -11 98 -15" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.26"/>

  <rect x="112" y="-2" width="6" height="12" rx="1" fill="#a8a898"/>
  <rect x="111" y="-3" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M115 -4 Q117 -9 114 -12" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- === Large storage tanks (2 central) === -->
  <circle cx="50" cy="46" r="10" fill="#a8a898" opacity="0.72"/>
  <circle cx="50" cy="46" r="7" fill="#989880" opacity="0.52"/>
  <circle cx="50" cy="46" r="2.5" fill="#8a8878" opacity="0.48"/>

  <circle cx="78" cy="46" r="10" fill="#a8a898" opacity="0.72"/>
  <circle cx="78" cy="46" r="7" fill="#989880" opacity="0.52"/>
  <circle cx="78" cy="46" r="2.5" fill="#8a8878" opacity="0.48"/>

  <!-- === Pipe network === -->
  <g stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="10" y1="20" x2="40" y2="20"/>
    <line x1="10" y1="30" x2="40" y2="30"/>
    <line x1="60" y1="36" x2="40" y2="36"/>
    <line x1="60" y1="36" x2="60" y2="56"/>
    <line x1="88" y1="36" x2="96" y2="36"/>
    <line x1="96" y1="20" x2="96" y2="36"/>
    <line x1="88" y1="56" x2="88" y2="36"/>
    <line x1="108" y1="20" x2="118" y2="20"/>
  </g>

  <!-- === Rust accent === -->
  <rect x="6" y="62" width="116" height="2.5" rx="0.5" fill="#b09070" opacity="0.28"/>

  <!-- === Loading bays (6 bays) === -->
  <g fill="#585858" opacity="0.5">
    <rect x="10" y="76" width="12" height="8" rx="0.5"/>
    <rect x="26" y="76" width="12" height="8" rx="0.5"/>
    <rect x="50" y="76" width="12" height="8" rx="0.5"/>
    <rect x="66" y="76" width="12" height="8" rx="0.5"/>
    <rect x="90" y="76" width="12" height="8" rx="0.5"/>
    <rect x="106" y="76" width="12" height="8" rx="0.5"/>
  </g>
  <g stroke="#989880" stroke-width="0.5" opacity="0.4">
    <line x1="16" y1="76" x2="16" y2="84"/>
    <line x1="32" y1="76" x2="32" y2="84"/>
    <line x1="56" y1="76" x2="56" y2="84"/>
    <line x1="72" y1="76" x2="72" y2="84"/>
    <line x1="96" y1="76" x2="96" y2="84"/>
    <line x1="112" y1="76" x2="112" y2="84"/>
  </g>

  <!-- === South yard: pallets, trucks, stains === -->
  <rect x="10" y="88" width="22" height="12" rx="1" fill="#c8b480" opacity="0.35"/>
  <rect x="42" y="90" width="18" height="8" rx="1" fill="#d8c498" opacity="0.3"/>
  <rect x="86" y="88" width="16" height="10" rx="1" fill="#c8b480" opacity="0.33"/>
  <rect x="106" y="90" width="14" height="8" rx="1" fill="#d8c498" opacity="0.28"/>
  <!-- Truck -->
  <rect x="56" y="102" width="18" height="10" rx="2" fill="#a8a898" opacity="0.45"/>
  <rect x="58" y="103" width="6" height="4" rx="0.5" fill="#a8d0e8" opacity="0.3"/>
  <!-- Rust stains -->
  <ellipse cx="36" cy="108" rx="10" ry="4" fill="#b09070" opacity="0.12"/>
  <ellipse cx="90" cy="112" rx="12" ry="3" fill="#b09070" opacity="0.1"/>
</svg>
