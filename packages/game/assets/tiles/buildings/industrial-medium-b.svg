<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Industrial medium B (3x2 tile footprint — rendered wider than tall) -->

  <!-- === Lot ground (industrial yard) === -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#c0c0b0" opacity="0.3"/>

  <!-- === Building shadow === -->
  <rect x="14" y="18" width="100" height="68" rx="2" fill="#000000" opacity="0.1" transform="translate(3,3)"/>

  <!-- === Factory walls === -->
  <rect x="14" y="18" width="100" height="68" rx="2" fill="#d8d8d0"/>

  <!-- === Roof === -->
  <rect x="12" y="16" width="104" height="62" rx="2" fill="#989880"/>

  <!-- Roof bay divisions (3 bays) -->
  <g stroke="#8a8878" stroke-width="1.2" opacity="0.4">
    <line x1="14" y1="47" x2="116" y2="47"/>
    <line x1="47" y1="16" x2="47" y2="78"/>
    <line x1="81" y1="16" x2="81" y2="78"/>
  </g>
  <g fill="#c0c0b0" opacity="0.2">
    <rect x="14" y="18" width="31" height="27" rx="1"/>
    <rect x="49" y="18" width="30" height="27" rx="1"/>
    <rect x="83" y="18" width="31" height="27" rx="1"/>
  </g>

  <!-- === Smokestacks (2) === -->
  <rect x="20" y="4" width="6" height="16" rx="1" fill="#a8a898"/>
  <rect x="19" y="3" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M23 2 Q25 -3 22 -7 Q20 -11 23 -14" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <rect x="100" y="6" width="6" height="12" rx="1" fill="#a8a898"/>
  <rect x="99" y="5" width="8" height="3" rx="0.5" fill="#989880"/>
  <path d="M103 4 Q105 -1 102 -5 Q100 -9 103 -12" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- === Storage tank on roof === -->
  <circle cx="64" cy="38" r="11" fill="#a8a898" opacity="0.7"/>
  <circle cx="64" cy="38" r="8" fill="#989880" opacity="0.5"/>
  <circle cx="64" cy="38" r="2.5" fill="#8a8878" opacity="0.48"/>

  <!-- === Pipe network === -->
  <g stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" opacity="0.52">
    <line x1="14" y1="28" x2="52" y2="28"/>
    <line x1="76" y1="28" x2="114" y2="28"/>
    <line x1="52" y1="28" x2="52" y2="50"/>
    <line x1="76" y1="28" x2="76" y2="50"/>
    <line x1="22" y1="20" x2="22" y2="28"/>
    <line x1="104" y1="20" x2="104" y2="28"/>
  </g>

  <!-- Rust stripe -->
  <rect x="12" y="72" width="104" height="2.5" rx="0.5" fill="#b09070" opacity="0.28"/>

  <!-- === Loading bays (4 bays) === -->
  <g fill="#585858" opacity="0.5">
    <rect x="18" y="80" width="14" height="7" rx="0.5"/>
    <rect x="38" y="80" width="14" height="7" rx="0.5"/>
    <rect x="76" y="80" width="14" height="7" rx="0.5"/>
    <rect x="96" y="80" width="14" height="7" rx="0.5"/>
  </g>
  <g stroke="#989880" stroke-width="0.5" opacity="0.4">
    <line x1="25" y1="80" x2="25" y2="87"/>
    <line x1="45" y1="80" x2="45" y2="87"/>
    <line x1="83" y1="80" x2="83" y2="87"/>
    <line x1="103" y1="80" x2="103" y2="87"/>
  </g>

  <!-- Small windows and door on south face -->
  <rect x="60" y="80" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="60" y="80" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.5"/>
  <line x1="62.5" y1="80" x2="62.5" y2="85" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  <rect x="68" y="79" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="71" cy="83" r="0.6" fill="#c0a080"/>

  <!-- === South yard === -->
  <rect x="14" y="90" width="20" height="12" rx="1" fill="#c8b480" opacity="0.35"/>
  <rect x="56" y="92" width="16" height="8" rx="1" fill="#d8c498" opacity="0.3"/>
  <rect x="94" y="90" width="18" height="12" rx="1" fill="#c8b480" opacity="0.32"/>
  <ellipse cx="44" cy="108" rx="10" ry="3.5" fill="#b09070" opacity="0.13"/>
</svg>
