  <ellipse cx="512" cy="384" rx="336" ry="228" fill="#90b8d8"/>
  <g fill="none" stroke="#80a8c8" stroke-width="1" opacity="0.3">
    <ellipse cx="512" cy="384" rx="330" ry="222"/>
    <ellipse cx="512" cy="384" rx="324" ry="216"/>
    <ellipse cx="512" cy="384" rx="318" ry="210"/>
    <ellipse cx="512" cy="384" rx="312" ry="204"/>
    <ellipse cx="512" cy="384" rx="306" ry="198"/>
    <ellipse cx="512" cy="384" rx="300" ry="192"/>
    <ellipse cx="512" cy="384" rx="294" ry="186"/>
    <ellipse cx="512" cy="384" rx="288" ry="180"/>
  </g>

  <!-- VIP concourse -->
  <ellipse cx="512" cy="384" rx="280" ry="172" fill="#b8b0a8"/>

  <!-- Lowest seating (gold/VIP) -->
  <ellipse cx="512" cy="384" rx="272" ry="164" fill="#e8d080"/>
  <g fill="none" stroke="#d8c070" stroke-width="1" opacity="0.25">
    <ellipse cx="512" cy="384" rx="268" ry="160"/>
    <ellipse cx="512" cy="384" rx="264" ry="156"/>
    <ellipse cx="512" cy="384" rx="260" ry="152"/>
  </g>

  <!-- Pitch surround / running track -->
  <ellipse cx="512" cy="384" rx="252" ry="144" fill="#d8c8a8" opacity="0.5"/>

  <!-- Soccer pitch (105x68m = 420x272px at true scale) -->
  <rect x="302" y="248" width="420" height="272" rx="3" fill="url(#fieldGrass)"/>

  <!-- Pitch grass stripe pattern -->
  <g fill="#62b048" opacity="0.12">
    <rect x="302" y="248" width="42" height="272"/>
    <rect x="386" y="248" width="42" height="272"/>
    <rect x="470" y="248" width="42" height="272"/>
    <rect x="554" y="248" width="42" height="272"/>
    <rect x="638" y="248" width="42" height="272"/>
  </g>

  <!-- Pitch markings -->
  <g fill="none" stroke="#e8e8e0" stroke-width="2" opacity="0.65">
    <!-- Boundary -->
    <rect x="312" y="258" width="400" height="252" rx="1"/>
    <!-- Center line -->
    <line x1="512" y1="258" x2="512" y2="510"/>
    <!-- Center circle (9.15m radius = ~37px) -->
    <circle cx="512" cy="384" r="37"/>
    <!-- Center spot -->
    <circle cx="512" cy="384" r="2" fill="#e8e8e0" stroke="none"/>

    <!-- Left penalty box (40.3x16.5m = 161x66px) -->
    <rect x="312" y="318" width="66" height="132"/>
    <!-- Left goal area (18.3x5.5m = 73x22px) -->
    <rect x="312" y="351" width="22" height="66"/>
    <!-- Left penalty spot (11m = 44px from goal line) -->
    <circle cx="356" cy="384" r="2" fill="#e8e8e0" stroke="none"/>
    <!-- Left penalty arc -->
    <path d="M378 348 A37 37 0 0 1 378 420"/>

    <!-- Right penalty box -->
    <rect x="646" y="318" width="66" height="132"/>
    <!-- Right goal area -->
    <rect x="690" y="351" width="22" height="66"/>
    <!-- Right penalty spot -->
    <circle cx="668" cy="384" r="2" fill="#e8e8e0" stroke="none"/>
    <!-- Right penalty arc -->
    <path d="M646 348 A37 37 0 0 0 646 420"/>

    <!-- Corner arcs (1m = 4px) -->
    <path d="M312 262 A4 4 0 0 1 316 258"/>
    <path d="M708 258 A4 4 0 0 1 712 262"/>
    <path d="M312 506 A4 4 0 0 0 316 510"/>
    <path d="M708 510 A4 4 0 0 0 712 506"/>
  </g>

  <!-- Goals -->
  <rect x="306" y="376" width="6" height="16" rx="1" fill="#e0e0e0" opacity="0.6"/>
  <rect x="712" y="376" width="6" height="16" rx="1" fill="#e0e0e0" opacity="0.6"/>

