<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 8x6 tile true-scale stadium (1024x768 = 256m x 192m) -->

  <defs>
    <linearGradient id="fieldGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ab850"/>
      <stop offset="100%" stop-color="#5eaa46"/>
    </linearGradient>
  </defs>

  <!-- Surrounding ground (parking / plaza) -->
  <rect width="1024" height="768" fill="#c8b898"/>

  <!-- Parking lot sections -->
  <!-- NW lot -->
  <g stroke="#b8a888" stroke-width="0.5" opacity="0.35">
    <line x1="30" y1="40" x2="30" y2="90"/>
    <line x1="42" y1="40" x2="42" y2="90"/>
    <line x1="54" y1="40" x2="54" y2="90"/>
    <line x1="66" y1="40" x2="66" y2="90"/>
    <line x1="78" y1="40" x2="78" y2="90"/>
    <line x1="90" y1="40" x2="90" y2="90"/>
    <line x1="25" y1="40" x2="95" y2="40"/>
    <line x1="25" y1="65" x2="95" y2="65"/>
    <line x1="25" y1="90" x2="95" y2="90"/>
  </g>
  <!-- NE lot -->
  <g stroke="#b8a888" stroke-width="0.5" opacity="0.35">
    <line x1="930" y1="40" x2="930" y2="90"/>
    <line x1="942" y1="40" x2="942" y2="90"/>
    <line x1="954" y1="40" x2="954" y2="90"/>
    <line x1="966" y1="40" x2="966" y2="90"/>
    <line x1="978" y1="40" x2="978" y2="90"/>
    <line x1="990" y1="40" x2="990" y2="90"/>
    <line x1="925" y1="40" x2="995" y2="40"/>
    <line x1="925" y1="65" x2="995" y2="65"/>
    <line x1="925" y1="90" x2="995" y2="90"/>
  </g>
  <!-- SW lot -->
  <g stroke="#b8a888" stroke-width="0.5" opacity="0.35">
    <line x1="30" y1="670" x2="30" y2="720"/>
    <line x1="42" y1="670" x2="42" y2="720"/>
    <line x1="54" y1="670" x2="54" y2="720"/>
    <line x1="66" y1="670" x2="66" y2="720"/>
    <line x1="78" y1="670" x2="78" y2="720"/>
    <line x1="25" y1="670" x2="83" y2="670"/>
    <line x1="25" y1="695" x2="83" y2="695"/>
    <line x1="25" y1="720" x2="83" y2="720"/>
