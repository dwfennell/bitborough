    <rect x="498" y="66" width="28" height="8" rx="3"/>
    <rect x="498" y="694" width="28" height="8" rx="3"/>
    <rect x="82" y="370" width="8" height="28" rx="3"/>
    <rect x="934" y="370" width="8" height="28" rx="3"/>
    <!-- Diagonal entrances -->
    <rect x="200" y="108" width="20" height="6" rx="2" transform="rotate(-35, 210, 111)"/>
    <rect x="804" y="108" width="20" height="6" rx="2" transform="rotate(35, 814, 111)"/>
    <rect x="200" y="654" width="20" height="6" rx="2" transform="rotate(35, 210, 657)"/>
    <rect x="804" y="654" width="20" height="6" rx="2" transform="rotate(-35, 814, 657)"/>
  </g>

  <!-- Floodlight towers -->
  <g>
    <rect x="156" y="140" width="8" height="8" rx="1" fill="#a8a898"/>
    <circle cx="160" cy="144" r="6" fill="#e8d8a0" opacity="0.25"/>
    <circle cx="160" cy="144" r="3" fill="#f0e8c0" opacity="0.5"/>

    <rect x="860" y="140" width="8" height="8" rx="1" fill="#a8a898"/>
    <circle cx="864" cy="144" r="6" fill="#e8d8a0" opacity="0.25"/>
    <circle cx="864" cy="144" r="3" fill="#f0e8c0" opacity="0.5"/>

    <rect x="156" y="620" width="8" height="8" rx="1" fill="#a8a898"/>
    <circle cx="160" cy="624" r="6" fill="#e8d8a0" opacity="0.25"/>
    <circle cx="160" cy="624" r="3" fill="#f0e8c0" opacity="0.5"/>

    <rect x="860" y="620" width="8" height="8" rx="1" fill="#a8a898"/>
    <circle cx="864" cy="624" r="6" fill="#e8d8a0" opacity="0.25"/>
    <circle cx="864" cy="624" r="3" fill="#f0e8c0" opacity="0.5"/>
