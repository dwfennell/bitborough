    <line x1="940" y1="670" x2="940" y2="720"/>
    <line x1="952" y1="670" x2="952" y2="720"/>
    <line x1="964" y1="670" x2="964" y2="720"/>
    <line x1="976" y1="670" x2="976" y2="720"/>
    <line x1="988" y1="670" x2="988" y2="720"/>
    <line x1="935" y1="670" x2="993" y2="670"/>
    <line x1="935" y1="695" x2="993" y2="695"/>
    <line x1="935" y1="720" x2="993" y2="720"/>
