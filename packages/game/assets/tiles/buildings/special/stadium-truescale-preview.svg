  <!-- Stadium shadow -->
  <ellipse cx="518" cy="390" rx="430" ry="320" fill="#000000" opacity="0.07"/>

  <!-- Stadium outer wall -->
  <ellipse cx="512" cy="384" rx="426" ry="316" fill="#a8a898"/>
  <ellipse cx="512" cy="384" rx="426" ry="316" fill="none" stroke="#989880" stroke-width="4" opacity="0.4"/>

  <!-- Outer concourse -->
  <ellipse cx="512" cy="384" rx="410" ry="300" fill="#b8b0a8"/>

  <!-- Structural ribs (radial lines from center outward through concourse) -->
  <g stroke="#a0988e" stroke-width="1" opacity="0.2">
    <line x1="512" y1="68" x2="512" y2="84"/>
    <line x1="512" y1="684" x2="512" y2="700"/>
    <line x1="86" y1="384" x2="102" y2="384"/>
    <line x1="922" y1="384" x2="938" y2="384"/>

    <line x1="220" y1="110" x2="230" y2="126"/>
    <line x1="804" y1="110" x2="794" y2="126"/>
    <line x1="220" y1="658" x2="230" y2="642"/>
    <line x1="804" y1="658" x2="794" y2="642"/>

    <line x1="350" y1="78" x2="354" y2="96"/>
    <line x1="674" y1="78" x2="670" y2="96"/>
    <line x1="350" y1="690" x2="354" y2="672"/>
    <line x1="674" y1="690" x2="670" y2="672"/>

    <line x1="130" y1="200" x2="146" y2="206"/>
    <line x1="130" y1="568" x2="146" y2="562"/>
    <line x1="894" y1="200" x2="878" y2="206"/>
    <line x1="894" y1="568" x2="878" y2="562"/>

    <line x1="100" y1="300" x2="118" y2="302"/>
    <line x1="100" y1="468" x2="118" y2="466"/>
    <line x1="924" y1="300" x2="906" y2="302"/>
    <line x1="924" y1="468" x2="906" y2="466"/>
  </g>

  <!-- Upper seating tier (terracotta) -->
  <ellipse cx="512" cy="384" rx="396" ry="288" fill="#c07060"/>
  <g fill="none" stroke="#b06858" stroke-width="1" opacity="0.3">
    <ellipse cx="512" cy="384" rx="390" ry="282"/>
    <ellipse cx="512" cy="384" rx="384" ry="276"/>
    <ellipse cx="512" cy="384" rx="378" ry="270"/>
    <ellipse cx="512" cy="384" rx="372" ry="264"/>
    <ellipse cx="512" cy="384" rx="366" ry="258"/>
    <ellipse cx="512" cy="384" rx="360" ry="252"/>
    <ellipse cx="512" cy="384" rx="354" ry="246"/>
