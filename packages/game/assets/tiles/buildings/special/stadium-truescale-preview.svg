  <g opacity="0.45">
    <rect x="31" y="42" width="9" height="5" rx="1" fill="#90b8d8"/>
    <rect x="43" y="42" width="9" height="5" rx="1" fill="#d08870"/>
    <rect x="55" y="42" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="67" y="42" width="9" height="5" rx="1" fill="#a8a898"/>
    <rect x="79" y="42" width="9" height="5" rx="1" fill="#585858"/>
    <rect x="31" y="67" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="43" y="67" width="9" height="5" rx="1" fill="#90b8d8"/>
    <rect x="55" y="67" width="9" height="5" rx="1" fill="#d08870"/>
    <rect x="67" y="67" width="9" height="5" rx="1" fill="#585858"/>

    <rect x="931" y="42" width="9" height="5" rx="1" fill="#d08870"/>
    <rect x="943" y="42" width="9" height="5" rx="1" fill="#90b8d8"/>
    <rect x="955" y="42" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="967" y="42" width="9" height="5" rx="1" fill="#a8a898"/>
    <rect x="931" y="67" width="9" height="5" rx="1" fill="#585858"/>
    <rect x="943" y="67" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="955" y="67" width="9" height="5" rx="1" fill="#d08870"/>

    <rect x="31" y="672" width="9" height="5" rx="1" fill="#a8a898"/>
    <rect x="43" y="672" width="9" height="5" rx="1" fill="#90b8d8"/>
    <rect x="55" y="672" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="31" y="697" width="9" height="5" rx="1" fill="#d08870"/>
    <rect x="43" y="697" width="9" height="5" rx="1" fill="#585858"/>

    <rect x="941" y="672" width="9" height="5" rx="1" fill="#e8e8e0"/>
    <rect x="953" y="672" width="9" height="5" rx="1" fill="#90b8d8"/>
    <rect x="965" y="672" width="9" height="5" rx="1" fill="#d08870"/>
    <rect x="941" y="697" width="9" height="5" rx="1" fill="#a8a898"/>
    <rect x="953" y="697" width="9" height="5" rx="1" fill="#585858"/>
  </g>

  <!-- Access roads -->
  <rect x="496" y="0" width="32" height="100" rx="1" fill="#707070" opacity="0.6"/>
  <rect x="496" y="668" width="32" height="100" rx="1" fill="#707070" opacity="0.6"/>
  <rect x="0" y="368" width="80" height="32" rx="1" fill="#707070" opacity="0.6"/>
  <rect x="944" y="368" width="80" height="32" rx="1" fill="#707070" opacity="0.6"/>

  <!-- Road center dashes on access roads -->
  <g fill="#e8d080" opacity="0.5">
    <rect x="511" y="10" width="2" height="8" rx="0.75"/>
    <rect x="511" y="26" width="2" height="8" rx="0.75"/>
    <rect x="511" y="42" width="2" height="8" rx="0.75"/>
    <rect x="511" y="58" width="2" height="8" rx="0.75"/>
    <rect x="511" y="74" width="2" height="8" rx="0.75"/>

    <rect x="511" y="678" width="2" height="8" rx="0.75"/>
    <rect x="511" y="694" width="2" height="8" rx="0.75"/>
    <rect x="511" y="710" width="2" height="8" rx="0.75"/>
