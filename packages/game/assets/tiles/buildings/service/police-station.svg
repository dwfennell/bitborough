<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Transparent background - terrain renders underneath -->

  <!-- Building shadow (3x3 facility) -->
  <rect x="32" y="30" width="64" height="58" rx="2" fill="#000000" opacity="0.11" transform="translate(3, 3)"/>

  <!-- Lot ground (paved parking/grounds) -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#b8b8a8" opacity="0.35"/>

  <!-- Parking lot detail (front area) -->
  <rect x="20" y="78" width="88" height="32" rx="2" fill="#a0a090" opacity="0.25"/>
  <!-- Parking space markings -->
  <line x1="32" y1="78" x2="32" y2="110" stroke="#d0d0c0" stroke-width="0.6" opacity="0.3"/>
  <line x1="48" y1="78" x2="48" y2="110" stroke="#d0d0c0" stroke-width="0.6" opacity="0.3"/>
  <line x1="80" y1="78" x2="80" y2="110" stroke="#d0d0c0" stroke-width="0.6" opacity="0.3"/>

  <!-- Main building (3x3) -->
  <rect x="32" y="30" width="64" height="58" rx="2" fill="#c8c8c8"/>
  <rect x="32" y="30" width="64" height="58" rx="2" fill="#d0d0d0" opacity="0.4"/>

  <!-- Roof -->
  <rect x="30" y="28" width="68" height="60" rx="2" fill="#1565c0" opacity="0.7"/>
  <!-- Roof accent edge -->
  <line x1="30" y1="28" x2="98" y2="28" stroke="#1565c0" stroke-width="1.5" opacity="0.5"/>

  <!-- Official police badge/insignia on roof -->
  <circle cx="64" cy="38" r="6" fill="#1565c0" opacity="0.5"/>
  <circle cx="64" cy="38" r="5" fill="none" stroke="#ffffff" stroke-width="0.8"/>
  <text x="64" y="40" font-size="5" fill="#ffffff" text-anchor="middle" font-weight="bold" opacity="0.7">P</text>

  <!-- Main entrance with official door -->
  <rect x="60" y="74" width="8" height="12" rx="1" fill="#0d47a1"/>
  <circle cx="66" cy="80.5" r="0.8" fill="#b8a080"/>
  <!-- Door frame detail -->
  <rect x="60" y="74" width="8" height="12" rx="1" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>

  <!-- Flag pole (on right side of building) -->
  <rect x="90" y="32" width="1.5" height="20" rx="0.5" fill="#8a8a7a"/>
  <!-- Flag -->
  <rect x="91.5" y="32" width="8" height="5" rx="0.5" fill="#1565c0" opacity="0.8"/>
  <rect x="91.5" y="32" width="8" height="5" rx="0.5" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.6"/>

  <!-- Large service garage doors (left side) -->
  <rect x="35" y="40" width="14" height="20" rx="1" fill="#0d47a1" opacity="0.6"/>
  <!-- Garage door panel lines -->
  <line x1="35" y1="45" x2="49" y2="45" stroke="#1565c0" stroke-width="0.5" opacity="0.4"/>
  <line x1="35" y1="50" x2="49" y2="50" stroke="#1565c0" stroke-width="0.5" opacity="0.4"/>
  <line x1="35" y1="55" x2="49" y2="55" stroke="#1565c0" stroke-width="0.5" opacity="0.4"/>

  <!-- Police car 1 in parking lot (parked front-left) -->
  <rect x="24" y="88" width="16" height="10" rx="2" fill="#1565c0" opacity="0.7"/>
  <!-- Car windows -->
  <rect x="26" y="89" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.5"/>
  <rect x="35" y="89" width="4" height="5" rx="0.5" fill="#a8d0e8" opacity="0.5"/>
  <!-- Police light bar (red/blue) -->
  <rect x="25" y="86" width="14" height="1.5" rx="0.5" fill="#c62828" opacity="0.4"/>

  <!-- Police car 2 in parking lot (parked right) -->
  <rect x="80" y="88" width="16" height="10" rx="2" fill="#1565c0" opacity="0.7"/>
  <!-- Car windows -->
  <rect x="82" y="89" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.5"/>
  <rect x="91" y="89" width="4" height="5" rx="0.5" fill="#a8d0e8" opacity="0.5"/>
  <!-- Police light bar -->
  <rect x="81" y="86" width="14" height="1.5" rx="0.5" fill="#c62828" opacity="0.4"/>

  <!-- Windows on main building (professional look) -->
  <rect x="37" y="52" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="37" y="52" width="5" height="5" rx="0.5" fill="none" stroke="#0d47a1" stroke-width="0.5"/>

  <rect x="45" y="52" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="45" y="52" width="5" height="5" rx="0.5" fill="none" stroke="#0d47a1" stroke-width="0.5"/>

  <rect x="74" y="52" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="74" y="52" width="5" height="5" rx="0.5" fill="none" stroke="#0d47a1" stroke-width="0.5"/>

  <rect x="82" y="52" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.6"/>
  <rect x="82" y="52" width="5" height="5" rx="0.5" fill="none" stroke="#0d47a1" stroke-width="0.5"/>

  <!-- Security light posts (small pylons) -->
  <rect x="18" y="50" width="2" height="8" rx="0.5" fill="#8a8a7a" opacity="0.4"/>
  <circle cx="19" cy="48" r="1.5" fill="#b8a080" opacity="0.5"/>

  <rect x="108" y="50" width="2" height="8" rx="0.5" fill="#8a8a7a" opacity="0.4"/>
  <circle cx="109" cy="48" r="1.5" fill="#b8a080" opacity="0.5"/>

  <!-- Building entrance sign area -->
  <rect x="56" y="24" width="16" height="3" rx="0.5" fill="#1565c0" opacity="0.5"/>
  <text x="64" y="26.5" font-size="2" fill="#ffffff" text-anchor="middle" opacity="0.6">POLICE</text>
</svg>
