<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="20" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="20" cy="48" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="108" cy="48" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 28 L15.5 22 L17 28Z"/>
    <path d="M16 28.5 L18 21 L19.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 30 L109.5 24 L111 30Z"/>
    <path d="M110 30.5 L112 23 L113.5 30.5Z"/>
  </g>

  <!-- Sidewalks - vertical from south edge to dead end -->
  <rect x="40" y="48" width="8" height="80" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="48" width="8" height="80" fill="#b0b0a8" opacity="0.6"/>
  <!-- Rounded dead end sidewalk on north side -->
  <path d="M88 56 A24 24 0 0 0 40 56 L40 48 L88 48Z" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - south to center with rounded dead end -->
  <rect x="48" y="64" width="32" height="64" fill="url(#paved)"/>
  <path d="M80 64 A16 16 0 0 0 48 64Z" fill="url(#paved)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="56" x2="40" y2="128"/>
    <line x1="88" y1="56" x2="88" y2="128"/>
    <!-- Rounded curb at dead end -->
    <path d="M88 56 A24 24 0 0 0 40 56" fill="none"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="72" r="0.8"/>
    <circle cx="70" cy="88" r="0.7"/>
    <circle cx="52" cy="100" r="0.9"/>
    <circle cx="74" cy="112" r="0.7"/>
    <circle cx="60" cy="80" r="0.8"/>
    <circle cx="68" cy="96" r="0.7"/>
    <circle cx="54" cy="116" r="0.8"/>
    <circle cx="72" cy="106" r="0.7"/>
    <circle cx="64" cy="120" r="0.6"/>
    <circle cx="58" cy="68" r="0.7"/>
  </g>

  <!-- White edge lines along road surface -->
  <rect x="48" y="64" width="1" height="64" fill="#e0e0e0" opacity="0.25"/>
  <rect x="79" y="64" width="1" height="64" fill="#e0e0e0" opacity="0.25"/>

  <!-- Solid white center line - vertical arm from south to center -->
  <rect x="63.25" y="64" width="1.5" height="64" fill="#e0e0e0" opacity="0.65"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="40" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="38" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
