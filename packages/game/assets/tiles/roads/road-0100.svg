<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="110" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 28 L15.5 22 L17 28Z"/>
    <path d="M16 28.5 L18 21 L19.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M20 100 L21.5 94 L23 100Z"/>
    <path d="M22 100.5 L24 93 L25.5 100.5Z"/>
  </g>

  <!-- Dirt road pavement - east edge to center with rounded dead end -->
  <rect x="64" y="50" width="64" height="28" fill="#d8c498"/>
  <path d="M64 50 A14 14 0 0 0 64 78Z" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="65" cy="48" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="85" cy="45" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="110" cy="55" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="65" cy="80" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="50" cy="62" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>

  <!-- Tire track ruts - across the center -->
  <line x1="64" y1="57" x2="128" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="64" y1="65" x2="128" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="72" cy="56" r="0.6"/>
    <circle cx="88" cy="70" r="0.5"/>
    <circle cx="100" cy="52" r="0.6"/>
    <circle cx="114" cy="66" r="0.5"/>
    <circle cx="80" cy="72" r="0.5"/>
    <circle cx="96" cy="58" r="0.6"/>
    <circle cx="108" cy="74" r="0.5"/>
    <circle cx="120" cy="54" r="0.6"/>
    <circle cx="76" cy="64" r="0.5"/>
    <circle cx="116" cy="62" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="85" cy="62" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="105" cy="62" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="70" cy="65" rx="3" ry="2.5" fill="#e8d8b0" opacity="0.28"/>

  <!-- Small flowers in grass -->
  <circle cx="30" cy="64" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="18" cy="90" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
