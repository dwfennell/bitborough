<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="20" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 100 L15.5 94 L17 100Z"/>
    <path d="M16 100.5 L18 93 L19.5 100.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 100 L109.5 94 L111 100Z"/>
    <path d="M110 100.5 L112 93 L113.5 100.5Z"/>
  </g>

  <!-- Dirt road pavement - N-E curve -->
  <!-- Vertical road (north) -->
  <rect x="50" y="0" width="28" height="50" fill="#d8c498"/>
  <!-- Horizontal road (east) -->
  <rect x="78" y="50" width="50" height="28" fill="#d8c498"/>
  <!-- Curve fill: inner corner -->
  <rect x="50" y="50" width="28" height="28" fill="#d8c498"/>
  <!-- Outer curve connection -->
  <path d="M50 78 Q50 50 78 50 L78 78Z" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="48" cy="20" rx="2" ry="3" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="40" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="80" cy="48" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="105" cy="55" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="110" cy="70" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>
  <ellipse cx="82" cy="78" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>

  <!-- Tire track ruts -->
  <!-- Vertical section -->
  <line x1="57" y1="0" x2="57" y2="50" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="0" x2="65" y2="50" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <!-- Horizontal section -->
  <line x1="78" y1="57" x2="128" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="78" y1="65" x2="128" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="14" r="0.6"/>
    <circle cx="70" cy="28" r="0.5"/>
    <circle cx="62" cy="60" r="0.6"/>
    <circle cx="74" cy="68" r="0.5"/>
    <circle cx="92" cy="58" r="0.5"/>
    <circle cx="106" cy="66" r="0.6"/>
    <circle cx="100" cy="74" r="0.5"/>
    <circle cx="118" cy="56" r="0.6"/>
    <circle cx="54" cy="40" r="0.5"/>
    <circle cx="112" cy="62" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="58" cy="32" rx="3" ry="4" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="70" cy="62" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="95" cy="62" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="85" cy="72" rx="3" ry="2.5" fill="#e8d8b0" opacity="0.25"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="90" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="100" cy="108" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
