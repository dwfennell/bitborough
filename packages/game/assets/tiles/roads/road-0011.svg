<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="108" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M106 28 L107.5 22 L109 28Z"/>
    <path d="M108 28.5 L110 21 L111.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M106 100 L107.5 94 L109 100Z"/>
    <path d="M108 100.5 L110 93 L111.5 100.5Z"/>
  </g>

  <!-- Dirt road pavement - S-W curve -->
  <!-- Vertical road (south) -->
  <rect x="50" y="78" width="28" height="50" fill="#d8c498"/>
  <!-- Horizontal road (west) -->
  <rect x="0" y="50" width="50" height="28" fill="#d8c498"/>
  <!-- Curve fill -->
  <rect x="50" y="50" width="28" height="28" fill="#d8c498"/>
  <path d="M50 50 Q50 78 78 78 L50 78Z" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="48" cy="50" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="20" cy="58" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="10" cy="70" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="80" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="48" cy="105" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>

  <!-- Tire track ruts -->
  <!-- Horizontal section -->
  <line x1="0" y1="57" x2="50" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="65" x2="50" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <!-- Vertical section -->
  <line x1="57" y1="78" x2="57" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="78" x2="65" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="92" r="0.6"/>
    <circle cx="70" cy="108" r="0.5"/>
    <circle cx="28" cy="58" r="0.6"/>
    <circle cx="14" cy="68" r="0.5"/>
    <circle cx="62" cy="68" r="0.5"/>
    <circle cx="54" cy="106" r="0.6"/>
    <circle cx="36" cy="60" r="0.5"/>
    <circle cx="8" cy="56" r="0.6"/>
    <circle cx="58" cy="118" r="0.5"/>
    <circle cx="20" cy="74" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="32" cy="62" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="62" cy="80" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="60" cy="105" rx="3" ry="2.5" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="24" cy="72" rx="2.5" ry="3" fill="#e8d8b0" opacity="0.25"/>

  <!-- Small flowers in grass -->
  <circle cx="108" cy="50" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="98" cy="18" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
