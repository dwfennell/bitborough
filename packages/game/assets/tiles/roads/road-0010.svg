<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="20" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="20" cy="48" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="108" cy="48" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 28 L15.5 22 L17 28Z"/>
    <path d="M16 28.5 L18 21 L19.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 30 L109.5 24 L111 30Z"/>
    <path d="M110 30.5 L112 23 L113.5 30.5Z"/>
  </g>

  <!-- Dirt road pavement - south to center with rounded dead end -->
  <rect x="50" y="64" width="28" height="64" fill="#d8c498"/>
  <path d="M78 64 A14 14 0 0 0 50 64Z" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="48" cy="65" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="60" cy="62" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="70" cy="64" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="82" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="48" cy="100" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>

  <!-- Tire track ruts - down the center -->
  <line x1="57" y1="64" x2="57" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="64" x2="65" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="72" r="0.6"/>
    <circle cx="70" cy="88" r="0.5"/>
    <circle cx="52" cy="100" r="0.6"/>
    <circle cx="74" cy="112" r="0.5"/>
    <circle cx="60" cy="80" r="0.5"/>
    <circle cx="68" cy="96" r="0.6"/>
    <circle cx="54" cy="116" r="0.5"/>
    <circle cx="72" cy="106" r="0.6"/>
    <circle cx="64" cy="120" r="0.5"/>
    <circle cx="58" cy="68" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="60" cy="85" rx="3" ry="4" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="70" cy="105" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="60" cy="65" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.28"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="40" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="38" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
