<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="108" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M106 28 L107.5 22 L109 28Z"/>
    <path d="M108 28.5 L110 21 L111.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M106 100 L107.5 94 L109 100Z"/>
    <path d="M108 100.5 L110 93 L111.5 100.5Z"/>
  </g>

  <!-- Sidewalks -->
  <!-- South vertical sidewalks -->
  <rect x="40" y="88" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="88" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <!-- West horizontal sidewalks -->
  <rect x="0" y="40" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="0" y="80" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- Outer curve sidewalk (NE quadrant) -->
  <path d="M40 88 L88 88 Q88 88 88 40 L80 40 Q80 80 40 80Z" fill="#b0b0a8" opacity="0.6"/>
  <!-- Inner curve sidewalk corner (SW quadrant) -->
  <rect x="40" y="80" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - S-W curve -->
  <!-- Vertical road (south) -->
  <rect x="48" y="80" width="32" height="48" fill="url(#paved)"/>
  <!-- Horizontal road (west) -->
  <rect x="0" y="48" width="48" height="32" fill="url(#paved)"/>
  <!-- Curve fill -->
  <rect x="48" y="48" width="32" height="32" fill="url(#paved)"/>
  <path d="M48 48 Q48 80 80 80 L48 80Z" fill="url(#paved)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5" fill="none">
    <!-- South outer curbs -->
    <line x1="40" y1="88" x2="40" y2="128"/>
    <line x1="88" y1="88" x2="88" y2="128"/>
    <!-- West outer curbs -->
    <line x1="0" y1="40" x2="40" y2="40"/>
    <line x1="0" y1="88" x2="40" y2="88"/>
    <!-- Outer curve curb (grass side, NE) -->
    <path d="M40 88 Q88 88 88 40"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="92" r="0.8"/>
    <circle cx="70" cy="108" r="0.7"/>
    <circle cx="28" cy="58" r="0.9"/>
    <circle cx="14" cy="68" r="0.7"/>
    <circle cx="62" cy="68" r="0.8"/>
    <circle cx="54" cy="106" r="0.7"/>
    <circle cx="36" cy="60" r="0.8"/>
    <circle cx="8" cy="56" r="0.7"/>
    <circle cx="58" cy="118" r="0.6"/>
    <circle cx="20" cy="74" r="0.7"/>
  </g>

  <!-- White edge lines along road surface -->
  <!-- South arm left edge -->
  <rect x="48" y="80" width="1" height="48" fill="#e0e0e0" opacity="0.25"/>
  <!-- West arm top edge -->
  <rect x="0" y="48" width="48" height="1" fill="#e0e0e0" opacity="0.25"/>

  <!-- Solid white center lines -->
  <!-- Vertical (south approach) -->
  <rect x="63.25" y="80" width="1.5" height="48" fill="#e0e0e0" opacity="0.65"/>
  <!-- Horizontal (west approach) -->
  <rect x="0" y="63.25" width="48" height="1.5" fill="#e0e0e0" opacity="0.65"/>

  <!-- Small flowers in grass -->
  <circle cx="108" cy="50" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="98" cy="18" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
