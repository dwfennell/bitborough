<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#686868"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="108" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M106 100 L107.5 94 L109 100Z"/>
    <path d="M108 100.5 L110 93 L111.5 100.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M106 28 L107.5 22 L109 28Z"/>
    <path d="M108 28.5 L110 21 L111.5 28.5Z"/>
  </g>

  <!-- Sidewalks -->
  <!-- North vertical sidewalks -->
  <rect x="40" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <!-- West horizontal sidewalks -->
  <rect x="0" y="40" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="0" y="80" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- Outer curve sidewalk (SE quadrant) -->
  <path d="M88 40 L88 88 Q88 88 40 88 L40 80 Q80 80 80 40Z" fill="#b0b0a8" opacity="0.6"/>
  <!-- Inner curve sidewalk corner (NW quadrant) -->
  <rect x="40" y="40" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - N-W curve -->
  <!-- Vertical road (north) -->
  <rect x="48" y="0" width="32" height="48" fill="url(#asphalt)"/>
  <!-- Horizontal road (west) -->
  <rect x="0" y="48" width="48" height="32" fill="url(#asphalt)"/>
  <!-- Curve fill -->
  <rect x="48" y="48" width="32" height="32" fill="url(#asphalt)"/>
  <path d="M80 80 Q80 48 48 48 L48 80Z" fill="url(#asphalt)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5" fill="none">
    <!-- North outer curbs -->
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="88" y1="0" x2="88" y2="40"/>
    <!-- West outer curbs -->
    <line x1="0" y1="40" x2="40" y2="40"/>
    <line x1="0" y1="88" x2="40" y2="88"/>
    <!-- Outer curve curb (grass side, SE) -->
    <path d="M88 40 Q88 88 40 88"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="14" r="0.8"/>
    <circle cx="70" cy="28" r="0.7"/>
    <circle cx="28" cy="58" r="0.9"/>
    <circle cx="14" cy="68" r="0.7"/>
    <circle cx="62" cy="60" r="0.8"/>
    <circle cx="36" cy="72" r="0.7"/>
    <circle cx="8" cy="56" r="0.8"/>
    <circle cx="54" cy="40" r="0.7"/>
    <circle cx="20" cy="62" r="0.6"/>
    <circle cx="68" cy="20" r="0.7"/>
  </g>

  <!-- Center lane markings -->
  <!-- Vertical (north approach) -->
  <rect x="63.25" y="4" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="18" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="32" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <!-- Horizontal (west approach) -->
  <rect x="4" y="63.25" width="8" height="1.5" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="18" y="63.25" width="8" height="1.5" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="32" y="63.25" width="8" height="1.5" rx="0.75" fill="#e8d080" opacity="0.7"/>

  <!-- Small flowers in grass -->
  <circle cx="108" cy="78" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="64" cy="108" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
