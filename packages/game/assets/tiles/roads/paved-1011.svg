<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="110" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#95d07a" opacity="0.4"/>

  <!-- Grass blade clusters in east grass area -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M108 28 L109.5 22 L111 28Z"/>
    <path d="M110 28.5 L112 21 L113.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 98 L109.5 92 L111 98Z"/>
    <path d="M110 98.5 L112 91 L113.5 98.5Z"/>
  </g>

  <!-- Sidewalks -->
  <!-- North vertical sidewalks -->
  <rect x="40" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <!-- South vertical sidewalks -->
  <rect x="40" y="88" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="88" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <!-- West horizontal sidewalks -->
  <rect x="0" y="40" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="0" y="80" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- East side: grass meets road -->
  <rect x="80" y="40" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="80" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- Inner corners on west -->
  <rect x="40" y="40" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="40" y="80" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement -->
  <!-- Vertical road (full N-S) -->
  <rect x="48" y="0" width="32" height="128" fill="url(#paved)"/>
  <!-- Horizontal road (west only) -->
  <rect x="0" y="48" width="48" height="32" fill="url(#paved)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5" fill="none">
    <!-- East curb (full length, grass side) -->
    <line x1="88" y1="0" x2="88" y2="128"/>
    <!-- North-west outer curbs -->
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="0" y1="40" x2="40" y2="40"/>
    <!-- South-west outer curbs -->
    <line x1="0" y1="88" x2="40" y2="88"/>
    <line x1="40" y1="88" x2="40" y2="128"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="14" r="0.8"/>
    <circle cx="70" cy="28" r="0.7"/>
    <circle cx="52" cy="55" r="0.9"/>
    <circle cx="74" cy="68" r="0.7"/>
    <circle cx="60" cy="105" r="0.8"/>
    <circle cx="72" cy="118" r="0.7"/>
    <circle cx="18" cy="60" r="0.8"/>
    <circle cx="30" cy="70" r="0.7"/>
    <circle cx="64" cy="82" r="0.6"/>
    <circle cx="58" cy="40" r="0.7"/>
    <circle cx="8" cy="68" r="0.6"/>
  </g>

  <!-- White edge lines along road surface -->
  <!-- Vertical road right edge -->
  <rect x="79" y="0" width="1" height="128" fill="#e0e0e0" opacity="0.25"/>
  <!-- West arm top edge -->
  <rect x="0" y="48" width="48" height="1" fill="#e0e0e0" opacity="0.25"/>

  <!-- Solid white center lines -->
  <!-- Vertical (north approach) -->
  <rect x="63.25" y="0" width="1.5" height="48" fill="#e0e0e0" opacity="0.65"/>
  <!-- Vertical (south approach) -->
  <rect x="63.25" y="80" width="1.5" height="48" fill="#e0e0e0" opacity="0.65"/>
  <!-- Horizontal (west approach) -->
  <rect x="0" y="63.25" width="48" height="1.5" fill="#e0e0e0" opacity="0.65"/>

  <!-- Crosswalk stripes - north approach -->
  <rect x="48" y="50" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="54" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="58" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="62" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>

  <!-- Crosswalk stripes - south approach -->
  <rect x="48" y="66" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="70" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="74" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>
  <rect x="48" y="78" width="32" height="2" fill="#e0e0e0" opacity="0.5"/>

  <!-- Crosswalk stripes - west approach -->
  <rect x="50" y="48" width="2" height="32" fill="#e0e0e0" opacity="0.5"/>
  <rect x="54" y="48" width="2" height="32" fill="#e0e0e0" opacity="0.5"/>
  <rect x="58" y="48" width="2" height="32" fill="#e0e0e0" opacity="0.5"/>
  <rect x="62" y="48" width="2" height="32" fill="#e0e0e0" opacity="0.5"/>

  <!-- Stop lines -->
  <rect x="65" y="46.5" width="14" height="1.5" rx="0.5" fill="#e0e0e0" opacity="0.6"/>
  <rect x="49" y="80" width="14" height="1.5" rx="0.5" fill="#e0e0e0" opacity="0.6"/>
  <rect x="46.5" y="65" width="1.5" height="14" rx="0.5" fill="#e0e0e0" opacity="0.6"/>

  <!-- Manhole cover in center -->
  <circle cx="64" cy="64" r="3" fill="#585858" opacity="0.5"/>
  <circle cx="64" cy="64" r="2" fill="#626262" opacity="0.4"/>
  <line x1="62.5" y1="62.5" x2="65.5" y2="65.5" stroke="#555555" stroke-width="0.5" opacity="0.4"/>
  <line x1="65.5" y1="62.5" x2="62.5" y2="65.5" stroke="#555555" stroke-width="0.5" opacity="0.4"/>

  <!-- Small flowers in grass -->
  <circle cx="112" cy="50" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="106" cy="78" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
