<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="20" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>

  <!-- Grass blade clusters in west grass area -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 28 L15.5 22 L17 28Z"/>
    <path d="M16 28.5 L18 21 L19.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M14 98 L15.5 92 L17 98Z"/>
    <path d="M16 98.5 L18 91 L19.5 98.5Z"/>
  </g>

  <!-- Dirt road pavement -->
  <!-- Vertical road (full N-S) -->
  <rect x="50" y="0" width="28" height="128" fill="#d8c498"/>
  <!-- Horizontal road (east only) -->
  <rect x="78" y="50" width="50" height="28" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="48" cy="20" rx="2" ry="3" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="48" cy="60" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="48" cy="100" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="80" cy="48" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="105" cy="55" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="110" cy="70" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>

  <!-- Tire track ruts -->
  <!-- Vertical section -->
  <line x1="57" y1="0" x2="57" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="0" x2="65" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <!-- Horizontal section -->
  <line x1="78" y1="57" x2="128" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="78" y1="65" x2="128" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="14" r="0.6"/>
    <circle cx="70" cy="28" r="0.5"/>
    <circle cx="52" cy="55" r="0.6"/>
    <circle cx="74" cy="68" r="0.5"/>
    <circle cx="60" cy="105" r="0.5"/>
    <circle cx="72" cy="118" r="0.6"/>
    <circle cx="100" cy="56" r="0.5"/>
    <circle cx="112" cy="68" r="0.6"/>
    <circle cx="64" cy="82" r="0.5"/>
    <circle cx="58" cy="40" r="0.6"/>
    <circle cx="118" cy="58" r="0.5"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="58" cy="32" rx="3" ry="4" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="70" cy="62" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="60" cy="95" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="95" cy="62" rx="3" ry="3" fill="#e8d8b0" opacity="0.25"/>

  <!-- Small flowers in grass -->
  <circle cx="15" cy="78" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="22" cy="48" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
