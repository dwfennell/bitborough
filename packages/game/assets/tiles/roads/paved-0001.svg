<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="110" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M106 28 L107.5 22 L109 28Z"/>
    <path d="M108 28.5 L110 21 L111.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M106 100 L107.5 94 L109 100Z"/>
    <path d="M108 100.5 L110 93 L111.5 100.5Z"/>
  </g>

  <!-- Sidewalks - horizontal from west edge to dead end -->
  <rect x="0" y="40" width="80" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="0" y="80" width="80" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- Rounded dead end sidewalk on east side -->
  <path d="M72 88 A24 24 0 0 0 72 40 L80 40 L80 88Z" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - west edge to center with rounded dead end -->
  <rect x="0" y="48" width="64" height="32" fill="url(#paved)"/>
  <path d="M64 80 A16 16 0 0 0 64 48Z" fill="url(#paved)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="40" x2="72" y2="40"/>
    <line x1="0" y1="88" x2="72" y2="88"/>
    <!-- Rounded curb at dead end -->
    <path d="M72 88 A24 24 0 0 0 72 40" fill="none"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="12" cy="56" r="0.8"/>
    <circle cx="28" cy="70" r="0.7"/>
    <circle cx="40" cy="52" r="0.9"/>
    <circle cx="54" cy="66" r="0.7"/>
    <circle cx="20" cy="72" r="0.8"/>
    <circle cx="36" cy="58" r="0.7"/>
    <circle cx="48" cy="74" r="0.8"/>
    <circle cx="8" cy="62" r="0.7"/>
    <circle cx="56" cy="56" r="0.6"/>
    <circle cx="32" cy="64" r="0.7"/>
  </g>

  <!-- White edge lines along road surface -->
  <rect x="0" y="48" width="64" height="1" fill="#e0e0e0" opacity="0.25"/>
  <rect x="0" y="79" width="64" height="1" fill="#e0e0e0" opacity="0.25"/>

  <!-- Solid white center line - horizontal arm from west to center -->
  <rect x="0" y="63.25" width="64" height="1.5" fill="#e0e0e0" opacity="0.65"/>

  <!-- Small flowers in grass -->
  <circle cx="98" cy="64" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="110" cy="38" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
