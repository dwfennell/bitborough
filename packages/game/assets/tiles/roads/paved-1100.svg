<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="20" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 100 L15.5 94 L17 100Z"/>
    <path d="M16 100.5 L18 93 L19.5 100.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 100 L109.5 94 L111 100Z"/>
    <path d="M110 100.5 L112 93 L113.5 100.5Z"/>
  </g>

  <!-- Sidewalks -->
  <!-- North vertical sidewalks -->
  <rect x="40" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="0" width="8" height="40" fill="#b0b0a8" opacity="0.6"/>
  <!-- East horizontal sidewalks -->
  <rect x="88" y="40" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <rect x="88" y="80" width="40" height="8" fill="#b0b0a8" opacity="0.6"/>
  <!-- Outer curve sidewalk (SW quadrant) -->
  <path d="M40 40 L40 88 Q40 88 88 88 L88 80 Q48 80 48 40Z" fill="#b0b0a8" opacity="0.6"/>
  <!-- Inner curve sidewalk corner (NE quadrant) -->
  <rect x="80" y="40" width="8" height="8" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - N-E curve -->
  <!-- Vertical road (north) -->
  <rect x="48" y="0" width="32" height="48" fill="url(#paved)"/>
  <!-- Horizontal road (east) -->
  <rect x="80" y="48" width="48" height="32" fill="url(#paved)"/>
  <!-- Curve fill: inner corner -->
  <rect x="48" y="48" width="32" height="32" fill="url(#paved)"/>
  <path d="M48 80 Q48 48 80 48 L80 80Z" fill="url(#paved)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5" fill="none">
    <!-- North outer curbs -->
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="88" y1="0" x2="88" y2="40"/>
    <!-- East outer curbs -->
    <line x1="88" y1="40" x2="128" y2="40"/>
    <line x1="88" y1="88" x2="128" y2="88"/>
    <!-- Outer curve curb (grass side, SW) -->
    <path d="M40 40 Q40 88 88 88"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="14" r="0.8"/>
    <circle cx="70" cy="28" r="0.7"/>
    <circle cx="62" cy="60" r="0.9"/>
    <circle cx="74" cy="68" r="0.7"/>
    <circle cx="92" cy="58" r="0.8"/>
    <circle cx="106" cy="66" r="0.7"/>
    <circle cx="100" cy="74" r="0.8"/>
    <circle cx="118" cy="56" r="0.7"/>
    <circle cx="54" cy="40" r="0.6"/>
    <circle cx="112" cy="62" r="0.7"/>
  </g>

  <!-- White edge lines along road surface -->
  <!-- North arm left edge -->
  <rect x="48" y="0" width="1" height="48" fill="#e0e0e0" opacity="0.25"/>
  <!-- East arm top edge -->
  <rect x="80" y="48" width="48" height="1" fill="#e0e0e0" opacity="0.25"/>

  <!-- Solid white center lines -->
  <!-- Vertical (north approach) -->
  <rect x="63.25" y="0" width="1.5" height="48" fill="#e0e0e0" opacity="0.65"/>
  <!-- Horizontal (east approach) -->
  <rect x="80" y="63.25" width="48" height="1.5" fill="#e0e0e0" opacity="0.65"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="90" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="100" cy="108" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
