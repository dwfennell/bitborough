<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#686868"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="20" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="22" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="16" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="112" cy="64" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 30 L15.5 24 L17 30Z"/>
    <path d="M16 30.5 L18 23 L19.5 30.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 98 L109.5 92 L111 98Z"/>
    <path d="M110 98.5 L112 91 L113.5 98.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.42">
    <path d="M104 40 L105.5 34 L107 40Z"/>
    <path d="M106 40.5 L108 33 L109.5 40.5Z"/>
  </g>

  <!-- Sidewalks - vertical full length -->
  <rect x="40" y="0" width="8" height="128" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="0" width="8" height="128" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - vertical full length -->
  <rect x="48" y="0" width="32" height="128" fill="url(#asphalt)"/>

  <!-- Curb lines - vertical -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="128"/>
    <line x1="88" y1="0" x2="88" y2="128"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="12" r="0.8"/>
    <circle cx="70" cy="28" r="0.7"/>
    <circle cx="52" cy="45" r="0.9"/>
    <circle cx="74" cy="58" r="0.7"/>
    <circle cx="60" cy="72" r="0.8"/>
    <circle cx="68" cy="88" r="0.7"/>
    <circle cx="54" cy="100" r="0.8"/>
    <circle cx="72" cy="115" r="0.7"/>
    <circle cx="64" cy="36" r="0.6"/>
    <circle cx="58" cy="82" r="0.7"/>
    <circle cx="76" cy="8" r="0.6"/>
    <circle cx="50" cy="120" r="0.7"/>
  </g>

  <!-- Center lane markings - dashed yellow, full length -->
  <rect x="63.25" y="4" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="18" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="32" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="46" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="60" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="74" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="88" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="102" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="116" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="78" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="50" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
