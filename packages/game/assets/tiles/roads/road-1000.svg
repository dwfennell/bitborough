<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#686868"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="20" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="20" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="108" cy="64" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 100 L15.5 94 L17 100Z"/>
    <path d="M16 100.5 L18 93 L19.5 100.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 98 L109.5 92 L111 98Z"/>
    <path d="M110 98.5 L112 91 L113.5 98.5Z"/>
  </g>

  <!-- Sidewalks - vertical from north edge to dead end -->
  <rect x="40" y="0" width="8" height="80" fill="#b0b0a8" opacity="0.6"/>
  <rect x="80" y="0" width="8" height="80" fill="#b0b0a8" opacity="0.6"/>
  <!-- Rounded dead end sidewalk -->
  <path d="M40 80 L40 64 A24 24 0 0 0 88 64 L88 80" fill="none"/>
  <path d="M40 72 A24 24 0 0 0 88 72 L88 80 L40 80Z" fill="#b0b0a8" opacity="0.6"/>

  <!-- Road pavement - north to center with rounded dead end -->
  <rect x="48" y="0" width="32" height="64" fill="url(#asphalt)"/>
  <path d="M48 64 A16 16 0 0 0 80 64Z" fill="url(#asphalt)"/>

  <!-- Curb lines -->
  <g stroke="#989898" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="72"/>
    <line x1="88" y1="0" x2="88" y2="72"/>
    <!-- Rounded curb at dead end -->
    <path d="M40 72 A24 24 0 0 0 88 72" fill="none"/>
  </g>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="56" cy="12" r="0.8"/>
    <circle cx="70" cy="28" r="0.7"/>
    <circle cx="52" cy="42" r="0.9"/>
    <circle cx="74" cy="54" r="0.7"/>
    <circle cx="60" cy="22" r="0.8"/>
    <circle cx="68" cy="48" r="0.7"/>
    <circle cx="54" cy="58" r="0.8"/>
    <circle cx="72" cy="36" r="0.7"/>
    <circle cx="64" cy="8" r="0.6"/>
    <circle cx="58" cy="62" r="0.7"/>
  </g>

  <!-- Center lane markings - from north edge to near center -->
  <rect x="63.25" y="4" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="18" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="32" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>
  <rect x="63.25" y="46" width="1.5" height="8" rx="0.75" fill="#e8d080" opacity="0.7"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="90" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="88" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
