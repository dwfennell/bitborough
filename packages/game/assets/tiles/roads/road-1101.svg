<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#82c466" opacity="0.35"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#95d07a" opacity="0.4"/>

  <!-- Grass blade clusters in south grass area -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M20 108 L21.5 102 L23 108Z"/>
    <path d="M22 108.5 L24 101 L25.5 108.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M106 100 L107.5 94 L109 100Z"/>
    <path d="M108 100.5 L110 93 L111.5 100.5Z"/>
  </g>

  <!-- Dirt road pavement -->
  <!-- Vertical road (north only) -->
  <rect x="50" y="0" width="28" height="78" fill="#d8c498"/>
  <!-- Horizontal road (full E-W) -->
  <rect x="0" y="50" width="128" height="28" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="48" cy="20" rx="2" ry="3" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="40" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="48" cy="70" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="20" cy="50" rx="3" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="105" cy="50" rx="2" ry="2.5" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="110" cy="70" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>

  <!-- Tire track ruts -->
  <!-- Vertical section -->
  <line x1="57" y1="0" x2="57" y2="78" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="0" x2="65" y2="78" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <!-- Horizontal section -->
  <line x1="0" y1="57" x2="128" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="65" x2="128" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="14" r="0.6"/>
    <circle cx="70" cy="28" r="0.5"/>
    <circle cx="18" cy="60" r="0.6"/>
    <circle cx="30" cy="70" r="0.5"/>
    <circle cx="100" cy="56" r="0.5"/>
    <circle cx="112" cy="68" r="0.6"/>
    <circle cx="64" cy="64" r="0.5"/>
    <circle cx="52" cy="55" r="0.6"/>
    <circle cx="74" cy="72" r="0.5"/>
    <circle cx="120" cy="58" r="0.6"/>
    <circle cx="8" cy="68" r="0.5"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="58" cy="32" rx="3" ry="4" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="32" cy="62" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="95" cy="62" rx="3" ry="3" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="70" cy="70" rx="2.5" ry="3" fill="#e8d8b0" opacity="0.25"/>

  <!-- Small flowers in grass -->
  <circle cx="50" cy="108" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="80" cy="110" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
