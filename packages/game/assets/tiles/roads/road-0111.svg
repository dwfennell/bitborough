<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="18" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#82c466" opacity="0.35"/>
  <ellipse cx="110" cy="18" rx="11" ry="8" fill="#95d07a" opacity="0.38"/>

  <!-- Grass blade clusters in north grass area -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M20 28 L21.5 22 L23 28Z"/>
    <path d="M22 28.5 L24 21 L25.5 28.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M104 24 L105.5 18 L107 24Z"/>
    <path d="M106 24.5 L108 17 L109.5 24.5Z"/>
  </g>

  <!-- Dirt road pavement -->
  <!-- Horizontal road (full E-W) -->
  <rect x="0" y="50" width="128" height="28" fill="#d8c498"/>
  <!-- Vertical road (south only) -->
  <rect x="50" y="50" width="28" height="78" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment -->
  <ellipse cx="20" cy="48" rx="3" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="60" cy="48" rx="2.5" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="100" cy="48" rx="2" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="80" rx="2.5" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="48" cy="105" rx="2" ry="2.5" fill="#8cc870" opacity="0.25"/>

  <!-- Tire track ruts -->
  <!-- Horizontal section -->
  <line x1="0" y1="57" x2="50" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="65" x2="50" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="78" y1="57" x2="128" y2="57" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="78" y1="65" x2="128" y2="65" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <!-- Vertical section -->
  <line x1="57" y1="50" x2="57" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="65" y1="50" x2="65" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="92" r="0.6"/>
    <circle cx="70" cy="108" r="0.5"/>
    <circle cx="18" cy="60" r="0.6"/>
    <circle cx="30" cy="70" r="0.5"/>
    <circle cx="100" cy="56" r="0.5"/>
    <circle cx="112" cy="68" r="0.6"/>
    <circle cx="64" cy="64" r="0.5"/>
    <circle cx="52" cy="72" r="0.6"/>
    <circle cx="74" cy="55" r="0.5"/>
    <circle cx="60" cy="118" r="0.6"/>
    <circle cx="8" cy="58" r="0.5"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="32" cy="62" rx="4" ry="3" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="95" cy="62" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="60" cy="80" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="70" cy="105" rx="2.5" ry="3" fill="#e8d8b0" opacity="0.25"/>

  <!-- Small flowers in grass -->
  <circle cx="50" cy="18" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="80" cy="16" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
