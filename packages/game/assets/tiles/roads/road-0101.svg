<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="20" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="22" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="108" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="64" cy="110" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 30 L15.5 24 L17 30Z"/>
    <path d="M16 30.5 L18 23 L19.5 30.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M112 98 L113.5 92 L115 98Z"/>
    <path d="M114 98.5 L116 91 L117.5 98.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.42">
    <path d="M30 40 L31.5 34 L33 40Z"/>
    <path d="M32 40.5 L34 33 L35.5 40.5Z"/>
  </g>

  <!-- Dirt road pavement - horizontal full length -->
  <rect x="0" y="50" width="128" height="28" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment along sides -->
  <ellipse cx="20" cy="48" rx="3" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="40" cy="50" rx="2" ry="2.5" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="60" cy="48" rx="2.5" ry="2" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="85" cy="50" rx="2" ry="2.5" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="30" cy="78" rx="2.5" ry="2" fill="#8cc870" opacity="0.32"/>
  <ellipse cx="55" cy="80" rx="2" ry="2.5" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="100" cy="76" rx="2" ry="2" fill="#8cc870" opacity="0.3"/>

  <!-- Tire track ruts - parallel lines across the center -->
  <line x1="0" y1="60" x2="128" y2="60" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="68" x2="128" y2="68" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots scattered on road -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="12" cy="56" r="0.6"/>
    <circle cx="28" cy="70" r="0.5"/>
    <circle cx="45" cy="52" r="0.6"/>
    <circle cx="58" cy="74" r="0.5"/>
    <circle cx="72" cy="60" r="0.5"/>
    <circle cx="88" cy="68" r="0.6"/>
    <circle cx="100" cy="54" r="0.5"/>
    <circle cx="115" cy="72" r="0.6"/>
    <circle cx="36" cy="64" r="0.5"/>
    <circle cx="82" cy="58" r="0.6"/>
    <circle cx="8" cy="76" r="0.5"/>
    <circle cx="120" cy="50" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="35" cy="58" rx="4" ry="3" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="65" cy="70" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="95" cy="62" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="40" cy="70" rx="3" ry="2.5" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="72" cy="54" rx="2.5" ry="3" fill="#e8d8b0" opacity="0.3"/>

  <!-- Small flowers in grass -->
  <circle cx="12" cy="30" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="108" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
