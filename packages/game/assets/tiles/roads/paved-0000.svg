<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paved" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
  </defs>

  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>
  <ellipse cx="22" cy="20" rx="14" ry="10" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="105" cy="22" rx="12" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="20" cy="108" rx="13" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="108" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="22" cy="64" rx="11" ry="8" fill="#9ad680" opacity="0.35"/>
  <ellipse cx="106" cy="64" rx="10" ry="7" fill="#95d07a" opacity="0.3"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M18 30 L19.5 24 L21 30Z"/>
    <path d="M20 30.5 L22 23 L23.5 30.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M100 98 L101.5 92 L103 98Z"/>
    <path d="M102 98.5 L104 91 L105.5 98.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.42">
    <path d="M95 26 L96.5 20 L98 26Z"/>
    <path d="M97 26.5 L99 19 L100.5 26.5Z"/>
  </g>

  <!-- Sidewalk pad - circular -->
  <circle cx="64" cy="64" r="24" fill="#b0b0a8" opacity="0.6"/>

  <!-- Curb line around sidewalk -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#989898" stroke-width="1.5" opacity="0.5"/>

  <!-- Road pavement pad - circular -->
  <circle cx="64" cy="64" r="16" fill="url(#paved)"/>

  <!-- Road surface texture -->
  <g fill="#606060" opacity="0.12">
    <circle cx="58" cy="58" r="0.8"/>
    <circle cx="70" cy="62" r="0.7"/>
    <circle cx="62" cy="70" r="0.9"/>
    <circle cx="68" cy="56" r="0.7"/>
    <circle cx="56" cy="66" r="0.8"/>
    <circle cx="72" cy="68" r="0.7"/>
    <circle cx="64" cy="52" r="0.6"/>
    <circle cx="64" cy="76" r="0.7"/>
  </g>

  <!-- Small flowers in grass -->
  <circle cx="24" cy="98" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="102" cy="28" r="1.2" fill="#e8d8a0" opacity="0.6"/>
  <circle cx="28" cy="40" r="1.3" fill="#e8a8b8" opacity="0.55"/>
</svg>
