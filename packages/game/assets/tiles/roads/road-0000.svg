<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="22" cy="20" rx="14" ry="10" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="105" cy="22" rx="12" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="20" cy="108" rx="13" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="108" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="64" cy="18" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="22" cy="64" rx="11" ry="8" fill="#9ad680" opacity="0.35"/>
  <ellipse cx="106" cy="64" rx="10" ry="7" fill="#95d07a" opacity="0.3"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M18 30 L19.5 24 L21 30Z"/>
    <path d="M20 30.5 L22 23 L23.5 30.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M100 98 L101.5 92 L103 98Z"/>
    <path d="M102 98.5 L104 91 L105.5 98.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.42">
    <path d="M95 26 L96.5 20 L98 26Z"/>
    <path d="M97 26.5 L99 19 L100.5 26.5Z"/>
  </g>

  <!-- Dirt road pad - circular -->
  <circle cx="64" cy="64" r="20" fill="#d8c498"/>

  <!-- Rough edges - irregular grass encroachment -->
  <ellipse cx="54" cy="50" rx="3" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="72" cy="48" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="78" cy="62" rx="2" ry="3" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="76" cy="78" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="60" cy="82" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>
  <ellipse cx="48" cy="74" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="50" cy="54" rx="2" ry="2" fill="#8cc870" opacity="0.3"/>

  <!-- Tire track ruts - parallel lines down the center -->
  <line x1="61" y1="50" x2="61" y2="78" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="67" y1="50" x2="67" y2="78" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="58" cy="60" r="0.6"/>
    <circle cx="70" cy="65" r="0.5"/>
    <circle cx="62" cy="72" r="0.6"/>
    <circle cx="68" cy="58" r="0.5"/>
    <circle cx="56" cy="68" r="0.5"/>
    <circle cx="72" cy="70" r="0.6"/>
    <circle cx="64" cy="54" r="0.5"/>
    <circle cx="64" cy="76" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="60" cy="64" rx="4" ry="3" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="70" cy="60" rx="3" ry="4" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="66" cy="72" rx="3.5" ry="2.5" fill="#e8d8b0" opacity="0.28"/>

  <!-- Small flowers in grass -->
  <circle cx="24" cy="98" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="102" cy="28" r="1.2" fill="#e8d8a0" opacity="0.6"/>
  <circle cx="28" cy="40" r="1.3" fill="#e8a8b8" opacity="0.55"/>
</svg>
