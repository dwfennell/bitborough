name: default
description: Impressionist orthographic tiles for Bitborough — soft, painterly, warm natural palette

defaults:
  iterations: 5
  viewBox: "0 0 128 128"
  tileSize: 128

criteria:
  palette:
    threshold: 7
    enabled: true
  structural_correctness:
    threshold: 8
    enabled: true
  scale_fidelity:
    threshold: 7
    enabled: true
  layer_ordering:
    threshold: 7
    enabled: true
  seamless_tiling:
    threshold: 7
    enabled: true
  style_consistency:
    threshold: 7
    enabled: true
  aesthetics:
    threshold: 7
    enabled: true
    guidance: |
      Impressionist style. Soft, painterly feel. Warm natural palette.
      Should evoke the charm of a small town seen from above.
      Penalize: harsh lines, flat fills, overly geometric, "clipart" feel.
  prompt_fidelity:
    threshold: 7
    enabled: true

palette:
