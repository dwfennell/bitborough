<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Grass base -->
  <rect width="128" height="128" fill="#8cc870"/>

  <!-- Grass texture patches -->
  <ellipse cx="18" cy="20" rx="12" ry="9" fill="#95d07a" opacity="0.4"/>
  <ellipse cx="110" cy="22" rx="11" ry="8" fill="#82c466" opacity="0.35"/>
  <ellipse cx="18" cy="108" rx="12" ry="9" fill="#95d07a" opacity="0.38"/>
  <ellipse cx="110" cy="106" rx="11" ry="8" fill="#82c466" opacity="0.4"/>
  <ellipse cx="16" cy="64" rx="10" ry="7" fill="#a0da88" opacity="0.3"/>
  <ellipse cx="112" cy="64" rx="10" ry="7" fill="#9ad680" opacity="0.32"/>

  <!-- Grass blade clusters -->
  <g fill="#6aaa50" opacity="0.45">
    <path d="M14 30 L15.5 24 L17 30Z"/>
    <path d="M16 30.5 L18 23 L19.5 30.5Z"/>
  </g>
  <g fill="#78b868" opacity="0.4">
    <path d="M108 98 L109.5 92 L111 98Z"/>
    <path d="M110 98.5 L112 91 L113.5 98.5Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.42">
    <path d="M104 40 L105.5 34 L107 40Z"/>
    <path d="M106 40.5 L108 33 L109.5 40.5Z"/>
  </g>

  <!-- Dirt road pavement - vertical full length -->
  <rect x="50" y="0" width="28" height="128" fill="#d8c498"/>

  <!-- Rough edges - grass encroachment along sides -->
  <ellipse cx="48" cy="20" rx="2" ry="3" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="52" cy="40" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="48" cy="60" rx="2" ry="2.5" fill="#8cc870" opacity="0.3"/>
  <ellipse cx="50" cy="85" rx="2.5" ry="2" fill="#8cc870" opacity="0.28"/>
  <ellipse cx="78" cy="30" rx="2" ry="2.5" fill="#8cc870" opacity="0.32"/>
  <ellipse cx="80" cy="55" rx="2.5" ry="2" fill="#8cc870" opacity="0.25"/>
  <ellipse cx="76" cy="100" rx="2" ry="2" fill="#8cc870" opacity="0.3"/>

  <!-- Tire track ruts - parallel lines down the center -->
  <line x1="60" y1="0" x2="60" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>
  <line x1="68" y1="0" x2="68" y2="128" stroke="#c8b480" stroke-width="2" opacity="0.25"/>

  <!-- Pebble/gravel texture dots scattered on road -->
  <g fill="#c8b480" opacity="0.2">
    <circle cx="56" cy="12" r="0.6"/>
    <circle cx="70" cy="28" r="0.5"/>
    <circle cx="52" cy="45" r="0.6"/>
    <circle cx="74" cy="58" r="0.5"/>
    <circle cx="60" cy="72" r="0.5"/>
    <circle cx="68" cy="88" r="0.6"/>
    <circle cx="54" cy="100" r="0.5"/>
    <circle cx="72" cy="115" r="0.6"/>
    <circle cx="64" cy="36" r="0.5"/>
    <circle cx="58" cy="82" r="0.6"/>
    <circle cx="76" cy="8" r="0.5"/>
    <circle cx="50" cy="120" r="0.6"/>
  </g>

  <!-- Dirt patches for variation -->
  <ellipse cx="58" cy="35" rx="3" ry="4" fill="#e8d8b0" opacity="0.3"/>
  <ellipse cx="70" cy="65" rx="3" ry="3.5" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="62" cy="95" rx="3.5" ry="3" fill="#e8d8b0" opacity="0.28"/>
  <ellipse cx="70" cy="40" rx="2.5" ry="3" fill="#e8d8b0" opacity="0.25"/>
  <ellipse cx="54" cy="72" rx="3" ry="2.5" fill="#e8d8b0" opacity="0.3"/>

  <!-- Small flowers in grass -->
  <circle cx="20" cy="78" r="1.5" fill="#e8c8d0" opacity="0.6"/>
  <circle cx="108" cy="50" r="1.2" fill="#e8d8a0" opacity="0.6"/>
</svg>
