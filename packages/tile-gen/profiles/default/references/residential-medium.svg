<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Transparent background - terrain renders underneath -->

  <!-- Building shadow (light source top-left) -->
  <rect x="40" y="34" width="48" height="40" rx="2" fill="#000000" opacity="0.1" transform="translate(3, 3)"/>

  <!-- Yard / lot ground -->
  <rect x="8" y="8" width="112" height="112" rx="3" fill="#a0d48a" opacity="0.55"/>

  <!-- Garden path from house to south edge -->
  <rect x="58" y="76" width="8" height="44" rx="1" fill="#c8b898" opacity="0.45"/>

  <!-- House walls (visible below roof on south side) -->
  <rect x="40" y="34" width="48" height="44" rx="2" fill="#e8c8b0"/>
  <rect x="40" y="34" width="48" height="44" rx="2" fill="#e0b89a" opacity="0.3"/>

  <!-- Roof (top-down view - 3px overhang beyond walls) -->
  <rect x="37" y="31" width="54" height="36" rx="2" fill="#d08870"/>
  <!-- Roof ridge line (horizontal for variety - different from small) -->
  <line x1="39" y1="49" x2="89" y2="49" stroke="#c07060" stroke-width="2" opacity="0.5"/>
  <!-- Roof shingle texture lines -->
  <g stroke="#c07860" stroke-width="0.5" opacity="0.25">
    <line x1="39" y1="38" x2="89" y2="38"/>
    <line x1="39" y1="43" x2="89" y2="43"/>
    <line x1="39" y1="55" x2="89" y2="55"/>
  </g>

  <!-- Chimney (4x4px) -->
  <rect x="78" y="33" width="4" height="4" rx="0.5" fill="#a08070"/>
  <rect x="77" y="32" width="6" height="2" rx="0.5" fill="#8a7060"/>
  <!-- Chimney smoke wisp -->
  <path d="M80 31 Q82 26 79 21 Q77 16 80 12" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Windows on south wall (3 windows, 5x5px each) -->
  <g>
    <rect x="44" y="71" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.8"/>
    <rect x="44" y="71" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
    <line x1="46.5" y1="71" x2="46.5" y2="76" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
    <line x1="44" y1="73.5" x2="49" y2="73.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  </g>
  <g>
    <rect x="55" y="71" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.8"/>
    <rect x="55" y="71" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
    <line x1="57.5" y1="71" x2="57.5" y2="76" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
    <line x1="55" y1="73.5" x2="60" y2="73.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  </g>
  <g>
    <rect x="66" y="71" width="5" height="5" rx="0.5" fill="#a8d0e8" opacity="0.8"/>
    <rect x="66" y="71" width="5" height="5" rx="0.5" fill="none" stroke="#987868" stroke-width="0.6"/>
    <line x1="68.5" y1="71" x2="68.5" y2="76" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
    <line x1="66" y1="73.5" x2="71" y2="73.5" stroke="#987868" stroke-width="0.4" opacity="0.6"/>
  </g>

  <!-- Door (4x8px) -->
  <rect x="77" y="70" width="4" height="8" rx="0.5" fill="#8a6848"/>
  <circle cx="80" cy="74.5" r="0.6" fill="#c0a080"/>

  <!-- Bushes flanking the house -->
  <ellipse cx="35" cy="72" rx="3.5" ry="3" fill="#78b868" opacity="0.7"/>
  <ellipse cx="33.5" cy="70.5" rx="2.5" ry="2" fill="#90c880" opacity="0.6"/>
  <ellipse cx="93" cy="70" rx="3.5" ry="2.5" fill="#78b868" opacity="0.7"/>
  <ellipse cx="91.5" cy="68.5" rx="2.5" ry="2" fill="#88c070" opacity="0.6"/>

  <!-- Yard tree -->
  <circle cx="100" cy="28" r="12" fill="#78b868" opacity="0.6"/>
  <circle cx="98" cy="26" r="9" fill="#90c880" opacity="0.5"/>
  <circle cx="102" cy="30" r="7" fill="#60a850" opacity="0.3"/>

  <!-- Parked car (18x8px) -->
  <rect x="16" y="42" width="18" height="8" rx="2" fill="#d08870" opacity="0.45"/>
  <rect x="18" y="43" width="5" height="6" rx="1" fill="#a8d0e8" opacity="0.35"/>
  <rect x="28" y="43" width="4" height="6" rx="1" fill="#a8d0e8" opacity="0.35"/>

  <!-- Flowers in yard -->
  <circle cx="20" cy="100" r="1.5" fill="#e8c8d0" opacity="0.65"/>
  <circle cx="21.5" cy="98.5" r="1.2" fill="#d8a8b8" opacity="0.55"/>
  <circle cx="100" cy="95" r="1.5" fill="#e8d8a0" opacity="0.6"/>

  <!-- Grass blade cluster -->
  <g fill="#6aaa50" opacity="0.4">
    <path d="M106 58 L107.5 52 L109 58Z"/>
    <path d="M108 58.5 L110 51 L111.5 58.5Z"/>
  </g>
</svg>
