<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grassBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cc870"/>
      <stop offset="100%" stop-color="#7abb62"/>
    </linearGradient>
  </defs>

  <!-- Base grass fill -->
  <rect width="128" height="128" fill="url(#grassBase)"/>

  <!-- Grass texture patches - layered irregular shapes for organic feel -->
  <ellipse cx="20" cy="15" rx="18" ry="12" fill="#95d07a" opacity="0.5"/>
  <ellipse cx="85" cy="40" rx="22" ry="10" fill="#82c466" opacity="0.4"/>
  <ellipse cx="45" cy="90" rx="20" ry="14" fill="#95d07a" opacity="0.45"/>
  <ellipse cx="110" cy="100" rx="16" ry="11" fill="#82c466" opacity="0.35"/>
  <ellipse cx="60" cy="55" rx="14" ry="9" fill="#9ad680" opacity="0.3"/>
  <ellipse cx="10" cy="70" rx="15" ry="10" fill="#a0da88" opacity="0.35"/>
  <ellipse cx="100" cy="10" rx="12" ry="8" fill="#9ad680" opacity="0.4"/>

  <!-- Darker patches for depth -->
  <ellipse cx="35" cy="35" rx="10" ry="7" fill="#6aaa50" opacity="0.3"/>
  <ellipse cx="90" cy="80" rx="12" ry="8" fill="#6aaa50" opacity="0.25"/>
  <ellipse cx="15" cy="110" rx="14" ry="6" fill="#6aaa50" opacity="0.3"/>

  <!-- Small grass blade clusters -->
  <g fill="#6aaa50" opacity="0.5">
    <path d="M30 62 L32 54 L34 62Z"/>
    <path d="M32 63 L35 53 L37 63Z"/>
    <path d="M28 63 L30 55 L33 63Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.45">
    <path d="M88 18 L90 10 L92 18Z"/>
    <path d="M90 19 L93 9 L95 19Z"/>
    <path d="M86 19 L88 12 L91 19Z"/>
  </g>
  <g fill="#6aaa50" opacity="0.4">
    <path d="M70 95 L72 87 L74 95Z"/>
    <path d="M72 96 L75 86 L77 96Z"/>
    <path d="M68 96 L70 89 L73 96Z"/>
  </g>
  <g fill="#78b868" opacity="0.5">
    <path d="M110 55 L112 48 L114 55Z"/>
    <path d="M112 56 L115 47 L117 56Z"/>
  </g>

  <!-- Tiny flower accents -->
  <circle cx="52" cy="28" r="1.8" fill="#e8c8d0" opacity="0.7"/>
  <circle cx="53.5" cy="26.5" r="1.5" fill="#d8a8b8" opacity="0.6"/>
  <circle cx="98" cy="65" r="1.8" fill="#e8d8a0" opacity="0.7"/>
  <circle cx="22" cy="98" r="2" fill="#e8c8d0" opacity="0.65"/>
  <circle cx="24" cy="96" r="1.5" fill="#d8b8c0" opacity="0.55"/>
</svg>
